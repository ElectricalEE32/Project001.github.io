RAW[1]=["เป็นที่ทราบดีว่าไฟฟ้าแรงสูงมีอันตรายมากยิ่งกว่าไฟฟ้าแรงต่ำ แต่ทำไมการไฟฟ้าจึงต้องใช้ไฟฟ้าแรงสูงในการส่งจ่ายพลังงานไฟฟ้า",["เพื่อลดกำลังไฟฟ้าสูญเสียเนื่องจากความต้านทาน I²R ในสายตัวนำส่งจ่าย","เพื่อลดกำลังไฟฟ้าสูญเสียไดอิเล็กตริกในระบบส่งจ่าย","เพื่อป้องกันผลของฟ้าผ่าได้ง่าย เพราะมีค่า BIL สูงขึ้น","เพื่อลดค่าเสิร์จอิมพีแดนซ์ ช่วยให้ส่งกำลังไฟฟ้าธรรมชาติได้สูงขึ้น"],0];
RAW[2]=["การส่งจ่ายไฟฟ้าแรงสูงมีการใช้ระบบแรงดันหลายระดับ การเลือกระดับแรงดันจะพิจารณาจาก",["หม้อแปลงไฟฟ้ากำลังมีขนาดแรงดันป้อนเข้าและจ่ายออกต่างๆกัน","ขึ้นอยู่กับระยะทางและขนาดกำลังไฟฟ้าที่ส่งจ่าย","ขึ้นอยู่กับความหนาแน่นของฟ้าผ่าที่เกิดขึ้นในแถบนั้น","ขึ้นอยู่กับการใช้ตัวนำสายเดี่ยวหรือสายควบต่อเฟส"],1];
RAW[3]=["ในระบบส่งจ่ายแรงสูงแบบขึงอากาศ มีค่าเสิร์จอิมพีแดนซ์ Zw หลายค่าตั้งแต่ 200Ω ถึง 600Ω เพราะว่า",["สายส่งตัวนำมีค่าความต้านทานไม่เท่ากัน","ขึ้นอยู่กับขนาดกระแสเสิร์จทรานเซียนต์ที่ไหลผ่าน","ขึ้นอยู่กับค่า L และค่า C ของสายส่ง","ขึ้นอยู่กับความยาวของสายส่งจ่าย"],2];
RAW[4]=["ในการส่งกำลังไฟฟ้าระบบส่งจ่ายไฟฟ้าแรงสูง การแปลงแรงดันให้สูงขึ้นหรือลดลงทำได้อย่างไร",["ใช้หม้อแปลงไฟฟ้ากำลัง","ใช้หม้อแปลงแรงดัน (voltage transformer)","ใช้เครื่องกำเนิดไฟฟ้า","ใช้วงจรรีโซแนนซ์"],0];
RAW[5]=["การใช้งานหม้อแปลงทดสอบ เพื่อให้อายุการใช้งานยาวนาน ควรปฏิบัติอย่างไร",["ใช้งานทดสอบที่ไม่เกิดเบรกดาวน์หรือวาบไฟตามผิวรัสดุทดสอบ","ใช้งานที่แรงดันและกระแสไม่เกิน 85% ของพิกัด","ใช้งานทดสอบที่โหลดกินกระแสประจุเท่านั้น","ไม่ทดสอบลูกถ้วยฉนวนเปรอะเปื้อน"],1];
RAW[6]=["ในโรงงานผลิตเคเบิลแรงสูงขนาดใหญ่ การทดสอบประจำเคเบิลชนิดความคงทนต่อแรงดันกระแสสลับความถี่ต่ำ นิยมใช้แรงดันทดสอบสูงที่ได้จาก",["หม้อแปลงทดสอบ เพราะใช้กำลังไฟฟ้าทดสอบน้อย","หม้อแปลงไฟฟ้ากำลัง เพราะมีกำลังไฟฟ้าสูง","วงจรรีโซแนนซ์ เพราะใช้กำลังไฟฟ้าจ่ายให้กับวงจรทดสอบมีค่าต่ำเท่ากับกำลังไฟฟ้าสูญเสียในวงจรทดสอบ","เครื่องกำเนิดไฟฟ้าขับด้วยมอเตอร์ เพราะปรับความถี่ได้ง่าย"],2];
RAW[7]=["การก่อสร้างสถานีไฟฟ้าย่อย GIS มีค่าใช้จ่ายสูงกว่า AIS หลายเท่า แต่บางกรณีจำเป็นต้องใช้ GIS เนื่องจาก",["เป็นย่านชุมชนหนาแน่น พื้นที่จำกัด และต้องการกำลังไฟฟ้าปริมาณมาก","เป็นย่านที่มีฟ้าผ่าหนาแน่น","เป็นย่านที่มีมลภาวะสูง","คำตอบ 1 และ 3 ถูกต้อง"],3];
RAW[8]=["เปรียบเทียบการส่งจ่ายกำลังไฟฟ้าด้วยสายขึงอากาศ (OL) กับเคเบิลใต้ดิน มีข้อดีข้อเสียต่างกันอย่างไร",["OL ประหยัดกว่าแต่ต้องใช้ที่ว่างมากกว่า มีผลกระทบต่อสภาพแวดล้อม","OL มีโอกาสถูกฟ้าผ่าได้ มีผลกระทบจากความเปรอะเปื้อน","เคเบิลใต้ดินเดินในทะเลได้ ไม่มีผลกระทบจากสภาพแวดล้อม ปลอดภัยสูง","ถูกทุกข้อ"],3];
RAW[9]=["การส่งจ่ายไฟฟ้ากำลังด้วยระบบกระแสตรงมีข้อดีกว่าระบบกระแสสลับ คือ",["สายส่ง DC ไม่มีโคโรนารบกวนสื่อสาร และไม่มีกำลังสูญเสียจากความต้านทาน","สายส่ง DC ไม่มีกำลังไฟฟ้าสูญเสียไดอิเล็กตริก","สายส่งระยะไกลแบบ DC ไม่ต้องใช้รีแอกเตอร์ชดเชยแฟกเตอร์กำลัง โดยเฉพาะเคเบิลทะเล","การใช้ระบบ DC ปรับระดับแรงดันได้ง่ายโดยใช้ตัวต้านทานแบ่งแรงดัน"],2];
RAW[10]=["การสร้างแรงดันสูงกระแสตรงจาก AC ด้วยวงจรเร็กติฟายเออร์ ต้องการลดแฟกเตอร์ระลอกให้น้อยลง อาจทำได้โดย",["ลดความถี่ให้น้อยลง","เพิ่มกระแสโหลด DC ให้สูงขึ้น","เพิ่มค่าตัวเก็บประจุกรองให้สูงขึ้น","คำตอบ 1 และ 3 ถูกต้อง"],2];
RAW[11]=["หม้อแปลงทดสอบมีขนาดแรงดันกระแสพอดีทดสอบหม้อแปลงกระแส (CT) 115kV 50Hz มีความจุ 600pF จะนำไปทดสอบเคเบิล 115kV ยาว 10 เมตร ความจุ 200pF/m ได้หรือไม่",["ได้ เพราะแรงดันระบบเท่ากัน","ได้ เพราะความจุของเคเบิลน้อยกว่า","ไม่ได้ เพราะแรงดันทดสอบและกระแสสูงกว่า","ไม่ได้ เพราะความจุของเคเบิลสูงกว่า จะกินกระแสเกินพิกัด"],3];
RAW[12]=["หม้อแปลงทดสอบพิกัดแรงดัน 500kV กระแสพิกัดด้านแรงสูง In=0.5A แรงดันลัดวงจร εsc=10% จงหา Isc และ Ssc",["Isc=1.0A, Ssc=500kVA","Isc=2.5A, Ssc=1250kVA","Isc=5.0A, Ssc=2500kVA","Isc=10.0A, Ssc=5000kVA"],2];
RAW[13]=["แรงดันอิมพัลส์รูปคลื่นฟ้าผ่ามาตรฐานที่สร้างได้ T1=0.95μs, T2=65μs ได้มาตรฐานหรือไม่ ถ้าไม่ได้จะแก้ไขอย่างไร",["T1 ได้มาตรฐานแต่ T2 ไม่ได้ ต้องลดความต้านทานปรับหางคลื่น Re ให้น้อยลง","T1 สั้นเกินไปต้องเพิ่มความต้านทานปรับหน้าคลื่น Rd หรือเพิ่ม Cb ส่วน T2 ยาวเกินไปต้องลดความต้านทานปรับหางคลื่น Re ให้น้อยลง","ต้านทานหางคลื่น Re ให้น้อยลง","แรงดันอิมพัลส์ที่สร้างได้ตามเกณฑ์มาตรฐานกำหนด"],0];
RAW[14]=["เครื่องกำเนิดแรงดันอิมพัลส์ปรับรูปคลื่นมาตรฐาน 1.2/50μs แล้ว ถ้าต่อออกนอกอาคารผ่านปลอกฉนวนตัวนำ (bushing) มีความจุ 400pF รูปคลื่นจะเปลี่ยนหรือไม่",["ไม่เปลี่ยนแปลง เพราะปลอกฉนวนทนแรงดันได้","เปลี่ยนแปลง หน้าคลื่นคงเดิมแต่หางคลื่นยาวขึ้น","เปลี่ยนแปลง หน้าคลื่นยาวขึ้นแต่หางคลื่นอาจยาวขึ้นเล็กน้อย","เปลี่ยนแปลง หน้าคลื่นและหางคลื่นสั้นลงทั้งคู่"],2];
RAW[15]=["วัสดุทดสอบ C=3000pF ทดสอบที่ 1000kV 50Hz ต้องใช้หม้อแปลงทดสอบกำลังอย่างน้อย 1000kVA ถ้านำหม้อแปลงนี้ทดสอบที่ 100kV จะทดสอบวัสดุที่ใช้กำลังไฟฟ้าได้อย่างมากเท่าไร",["100kVA","1000kVA","500kVA","50kVA"],0];
RAW[16]=["เครื่องกำเนิดแรงดันอิมพัลส์ 10 ขั้น 1000kV ตัวเก็บประจุแต่ละขั้น 0.5μF 100kV จะทดสอบ BIL เคเบิล 115kV ที่ค่าเก็บประจุรวม 5000pF ได้หรือไม่",["ไม่ได้เพราะ kJ ของเครื่อง < kJ ของเคเบิล","ไม่ได้เพราะค่าตัวเก็บประจุของเครื่องมากกว่าของเคเบิล","ได้ เพราะค่าตัวเก็บประจุเครื่องมากกว่าเคเบิลไม่น้อยกว่า 10 เท่าและมีพลังงานเพียงพอ","ไม่ได้เพราะแรงดันตัวเก็บประจุเครื่อง 100kV < 115kV ของเคเบิล"],2];
RAW[17]=["ไฟฟ้าแรงสูงตามมาตรฐาน IEC Publ. No.60 หมายถึงไฟฟ้าที่มีแรงดันตั้งแต่กี่โวลต์ขึ้นไป",["380 โวลต์","800 โวลต์","1000 โวลต์","4000 โวลต์"],2];
RAW[18]=["โดยทั่วไปการทดสอบทางไฟฟ้าแรงสูงแบ่งออกเป็น 2 ประเภทตามข้อใด",["การทดสอบกับแรงดันต่ำและแรงดันสูง","การทดสอบกับแรงดันทรานเซียนต์ (transient overvoltage) และแรงดันกระแสสลับ","การทดสอบความทนทาน (endurance test)และการทดสอบความคงทนอยู่ได้ต่อแรงดัน (widthstand voltage test)","การทดสอบแบบไม่ทำลาย (non-destructive test) และการทดสอบแบบทำลาย (destructive test)"],3];
RAW[19]=["หม้อแปลงทดสอบออกแบบสำหรับทดสอบประจำลูกถ้วยฉนวน จะนำไปทดสอบประจำสายเคเบิลแรงสูง ที่แรงดันเดียวกันได้หรือไม่",["ได้ เนื่องจากแรงดันของระบบเท่ากัน","ได้ เนื่องจากกระแสที่ใช้ทดสอบเท่ากัน","ไม่ได้ เนื่องจากกระแสทดสอบลูกถ้วยมีค่าน้อยกว่าเมื่อเทียบกับเคเบิล ที่แรงดันเดียวกัน","ไม่ได้ เนื่องจากกระแสทดสอบเคเบิลมีค่าน้อยกว่าเมื่อเทียบกับลูกถ้วย ที่แรงดันเดียวกัน"],2];
RAW[20]=["เคเบิลทดสอบมีค่าเก็บประจุขึ้นอยู่กับความยาว การทดสอบด้วยวงจรรีโซแนนซ์จะปรับวงจรอย่างไรเพื่อให้เกิดรีโซแนนซ์",["ปรับค่ากระแสของหม้อแปลงทดสอบ","ปรับค่าความเหนี่ยวนำของรีแอกเตอร์แรงสูง","ปรับค่าช่องแกปแกนเหล็กของรีแอกเตอร์","คำตอบ 2 และ 3 ถูกต้อง"],3];
RAW[21]=["การใช้หม้อแปลงเทสลาทดสอบลูกถ้วยฉนวนพอร์ซเลนที่ผลิตในโรงงาน มีจุดประสงค์อย่างไร",["ทดสอบหาค่าแรงดันคงทนของเนื้อพอร์ซเลน ตรวจพบวาบไฟตามผิวได้ง่าย","ทดสอบหาค่ากำลังไฟฟ้าสูญเสียจากเนื้อพอร์ซเลน","ทดสอบหาความบกพร่องในเนื้อพอร์ซเลน ซึ่งจะเกิดการเจาะทะลุ และหากเป็นลูกถ้วยที่ดีจะสังเกตเห็นประกายวาบไฟตามผิวภายนอก","ทดสอบหาความบกพร่องในเนื้อพอร์ซเลน ซึ่งจะเกิดวาบไฟตามผิว และหากเป็นลูกถ้วยที่ดีจะไม่เกิดวาบไฟตามผิว"],2];
RAW[22]=["ข้อใดคือรูปคลื่นแรงดันอิมพัลส์ฟ้าผ่า ตามค่าเวลาหน้าคลื่นและหางคลื่น",["1.2/50 ไมโครวินาที","12/50 ไมโครวินาที","8/20 ไมโครวินาที","250/2500 ไมโครวินาที"],0];

RAW[150]=["บัสบาร์ทรงกระบอกซ้อนแกนร่วมตัวนำในมีเส้นผ่านศูนย์กลาง 10cm ตัวนำกระบอกนอกมีเส้นผ่านศูนย์กลางที่พอเหมาะทำให้แรงดันสูงสุดฉนวนระหว่างตัวนำเป็นอากาศ มีความคงทนต่อความเครียดสนามไฟฟ้า Eb=30kV/cm จงป้อนแรงดันให้กับบัสบาร์นี้ได้สูงสุด Ub เท่าใด และมีความเครียดสนามไฟฟ้าสูงสุด Em เท่าใด เกิดขึ้นที่ไหนของบัสบาร์",["Ub=212.2kV, Em=30kV/cm เกิดขึ้นที่ผิวตัวนำใน","Ub=150kV, Em=21.2kV/cm เกิดขึ้นที่ผิวตัวนำนอก","Ub=150kV, Em=30kV/cm เกิดขึ้นที่ผิวตัวนำใน","Ub=212.2kV, Em=21.2kV/cm เกิดขึ้นที่ผิวตัวนำใน"],2];
RAW[151]=["เคเบิลแรงสูง XLPE ตัวนำในขนาดเส้นผ่านศูนย์กลาง 4cm ตัวนำนอกเป็นชีลด์ขนาดเส้นผ่านศูนย์กลาง 12cm มีฟองก๊าซเล็กๆ 2จุด จุดที่1อยู่ที่รัศมี 2.5cm จุดที่2อยู่ที่รัศมี 5cm ถ้าป้อนแรงดันเพิ่มสูงขึ้นถึงระดับหนึ่งจะเกิด PD ที่ฟองก๊าซไหนก่อน",["เกิดขึ้นที่ฟองก๊าซทั้งสองพร้อมกัน","เกิดที่ฟองก๊าซจุดที่1ก่อน","เกิดที่ฟองก๊าซจุดที่2ก่อน","ไม่เกิด PD ทั้งสองจุดจนกว่าจะเกิดเบรกดาวน์"],1];
RAW[152]=["แฟกเตอร์สนามไฟฟ้า (field factor) η* ของระบบอิเล็กโตรด คืออะไร มีนิยามว่าอย่างไร",["η* แสดงถึงความสม่ำเสมอของสนามไฟฟ้ามากหรือน้อยคือ η*=Eav/Emax","η* แสดงถึงความเครียดสนามไฟฟ้าสูงสุด Emax เป็นกี่เท่าของค่าเฉลี่ย Eav คือ η*=Emax/Eav","Ei คือ η*=Eb/Ei","η* เป็นอัตราส่วนของสนามไฟฟ้าสูงสุด Emax ต่อสนามไฟฟ้าต่ำสุด นั่นคือ η*=Emax/Emin"],0];
RAW[153]=["จงเปรียบเทียบแฟกเตอร์สนามไฟฟ้า (field factor) η* ของอิเล็กโตรดปลายแหลม-ระนาบเป็น η1* ของอิเล็กโตรดทรงกลม-ระนาบเป็น η2* และของอิเล็กโตรดระนาบ-ระนาบเป็น η3*",["η1* > η2* > η3*","η1* < η2* < η3*","η1* > η2* < η3*","η1* < η2* > η3*"],1];
RAW[154]=["จงเปรียบเทียบแฟกเตอร์สนามไฟฟ้า (field factor) η* ของอิเล็กโตรดทรงกระบอกซ้อนแกนร่วมเป็น η1* กับทรงกลมซ้อนศูนย์กลางร่วม (concentric sphere) เป็น η2* ที่มีมิติพอเหมาะทั้งสองระบบ",["η1* < η2*","η1* = η2*","η1* > η2*","η1* < η2* สำหรับแรงดัน AC/DC และ η1* > η2* สำหรับแรงดันอิมพัลส์"],2];
RAW[155]=["การใช้สายควบ (bundled conductor) ในการส่งจ่ายไฟฟ้ากำลังที่ระดับแรงดันสูงกว่า 300kV มีผลดีอย่างไร",["กำลังไฟฟ้าสูญเสียเนื่องจากโคโรนาจะลดลง","ค่าเสิร์จอิมพีแดนซ์ Zw ลดลง ทำให้ส่งกำลังไฟฟ้าได้เพิ่มขึ้น","แรงดันควบคุมและเสถียรภาพของระบบดีขึ้น","ถูกทุกคำตอบ"],3];
RAW[156]=["เคเบิล 1 และ 2 ขนาดตัวนำและฉนวนเท่ากัน ใช้แรงดันและฉนวนเดียวกัน เคเบิล1: εr1=4, tanδ1=4%, ρ1=2×10¹²Ω·cm, Eb1=150kV/cm เคเบิล2: εr2=2, tanδ2=2%, ρ2=4×10¹²Ω·cm, Eb2=100kV/cm ข้อใดต่อไปนี้ถูกต้อง",["เคเบิล1เก็บพลังงานอัดประจุได้มากกว่าเคเบิล2","เคเบิล1มีกำลังไฟฟ้าสูญเสียไดอิเล็กตริกสูงกว่าเคเบิล2","เคเบิล1มีความเครียดสนามไฟฟ้าสูงสุด Emax สูงกว่าเคเบิล2","คำตอบ 1 และ 2 ถูกต้อง"],3];
RAW[157]=["ปลอกฉนวนตัวนำ (bushing) แบบเก็บประจุจะใส่แผ่นโลหะเปลวฝังแทรกเป็นชั้นๆในลักษณะทรงกระบอกซ้อนแกนร่วมตัวนำไว้เพื่ออะไร",["เพื่อให้ปลอกฉนวนมีความจุไฟฟ้าสูงขึ้น","เพื่อให้ปลอกฉนวนมีความคงทนต่อแรงดันเจาะทะลุเนื้อฉนวนได้สูงขึ้น","เพื่อควบคุมการกระจายแรงดันตามผิวฉนวนให้สม่ำเสมอ ป้องกันไม่ให้เกิด PD ตามผิวฉนวน","เพื่อให้ค่าวาบไฟตามผิวปลอกฉนวนมีค่าสูงกว่าค่าแรงดันเจาะทะลุตามแนวรัศมี"],2];
RAW[158]=["ลูกถ้วยฉนวนที่ใช้ยึดหรือรองรับตัวนำสายส่งจ่ายแรงสูง จะได้รับการออกแบบให้เกิดวาบไฟตามผิวง่ายกว่าการเกิดเจาะทะลุเนื้อฉนวน เพราะอะไร",["เพราะช่วยให้สังเกตการเกิดผิดพร่องบนลูกถ้วยได้ง่าย","เพราะอากาศมีความคงทนต่อความเครียดสนามไฟฟ้า Eb ได้น้อยกว่าเนื้อฉนวนแข็ง","เพราะถ้าให้เกิดเจาะทะลุผ่านเนื้อฉนวนลูกถ้วยแล้ว ลูกถ้วยฉนวนจะเสียสภาพการฉนวนอย่างถาวร","เพราะการเกิดวาบไฟตามผิวจะใช้พลังงานน้อยกว่า"],2];
RAW[159]=["พวงลูกถ้วยแขวนที่ใช้ยึดหรือรองรับตัวนำสายส่งแรงสูงระบบ 230kV 50Hz มีจำนวนลูกถ้วยในพวง 14 ลูก ยึดอยู่กับแขนเสาไฟฟ้าที่ต่อลงดิน พบว่าแรงดันกระจายบนพวงลูกถ้วยไม่เป็นเชิงเส้นทำให้ค่าแรงดันวาบไฟตามผิวของพวงต่ำกว่าค่าพิกัด เป็นผลจากอะไร ในทางปฏิบัติแก้ไขปัญหานี้อย่างไร",["เป็นผลจากค่าความจุไฟฟ้าของลูกถ้วยแต่ละลูกไม่เท่ากัน แก้โดยใช้ลูกถ้วยมีความจุแต่ละลูกเท่ากัน","เป็นผลจากค่าความจุไฟฟ้าสเตรย์ของลูกถ้วยแต่ละลูกกับเสาไฟฟ้าและดิน แก้โดยใส่แหวนชีลด์ (shielding ring) ที่พวงลูกถ้วยยึดตัวนำแรงสูง","เป็นผลจากที่ลูกถ้วยแต่ละลูกอยู่ห่างจากตัวนำแรงสูงไม่เท่ากัน แก้โดยใส่เขาอาร์ก (arcing horn)","คำตอบ 2 และ 3 ถูกต้อง"],1];

RAW[196]=["กฎของ Paschen's law กล่าวไว้ว่า",["แรงดันเบรกดาวน์จะมีค่าเพิ่มขึ้น เมื่อความดันเพิ่มขึ้น","แรงดันเบรกดาวน์จะมีค่าลดลง เมื่อระยะห่างลดลง","แรงดันเบรกดาวน์จะมีค่าคงที่ เมื่อผลคูณของความดันและระยะห่างคงที่","แรงดันเบรกดาวน์จะมีค่าคงที่ เมื่อผลคูณของอุณหภูมิและระยะห่างคงที่"],2];

RAW[199]=["เมื่ออุณหภูมิของก๊าซสูงขึ้น แรงดันเบรกดาวน์มีค่าลดลงหรือเพิ่มขึ้นเพราะเหตุใด",["ลดลง เพราะก๊าซมีพลังงานจลน์เพิ่มขึ้น ทำให้โมเลกุลของก๊าซเคลื่อนที่ชนกันแล้วมีโอกาสเกิดไอออไนเซชันมากขึ้น","ลดลง เพราะก๊าซมีพลังงานจลน์ลดลงทำให้โมเลกุลเคลื่อนที่ชนกันแล้วมีโอกาสเกิดไอออไนเซชันลดลง","เพิ่มขึ้น เพราะก๊าซมีพลังงานจลน์เพิ่มขึ้น ทำให้โมเลกุลเคลื่อนที่ชนกันแล้วมีโอกาสเกิดไอออไนเซชันมากขึ้น","ไม่มีผลต่อแรงดันเบรกดาวน์"],0];
RAW[200]=["เมื่อความดันของอากาศสูงขึ้นกว่าความดันบรรยากาศ (หรือมากกว่าจุดต่ำสุดของ Paschen) แรงดันเบรกดาวน์ของก๊าซมีค่าเพิ่มขึ้นหรือลดลงเพราะเหตุใด",["ลดลง เพราะก๊าซมีระยะทางอิสระเฉลี่ยเพิ่มขึ้น ความเร็วในการชนกันเพิ่มขึ้น มีโอกาสเกิดไอออไนเซชันลดลง","เพิ่มขึ้น เพราะก๊าซมีระยะทางอิสระเฉลี่ยลดลง ความเร็วในการชนกันลดลง มีโอกาสเกิดไอออไนเซชันลดลง","เพิ่มขึ้น เพราะก๊าซมีระยะทางอิสระเฉลี่ยเพิ่มขึ้น ความเร็วในการชนกันเพิ่มขึ้น มีโอกาสเกิดไอออไนเซชันเพิ่มขึ้น","ผิดทุกข้อ เพราะความดันอากาศไม่มีผลต่อการเกิดเบรกดาวน์"],1];
RAW[201]=["การอธิบายการเกิดเบรกดาวน์ของทาวน์เซนด์ สัมประสิทธิ์ตัวที่ 1 (α) หมายถึงอะไร",["ค่าเฉลี่ยของการชนแล้วเกิดเมตาสเตเบิล","ค่าเฉลี่ยของการชนของอิเล็กตรอน 1 ตัวกับโมเลกุลของก๊าซแล้วเกิดไอออไนเซชันต่อระยะทาง 1 ซม.","ค่าเฉลี่ยของการเกิดไอออนบวกในแกป จากพลังงานควอนตัม (quantum)","ค่าเฉลี่ยของการชนของไอออนบวกกับโมเลกุลที่เป็นกลาง แล้วทำให้เกิดไอออไนเซชันต่อระยะทาง 1 ซม."],1];

RAW[212]=["ในระบบก๊าซอัดความดัน p ที่มีอิเล็กโตรดรัศมี r และระยะแกปเป็น d ค่าแรงดันเบรกดาวน์ Ub อาจหาได้จาก Paschen's curve อยากทราบว่า Paschen's curve คืออะไร",["คือความสัมพันธ์ของ Ub อยู่ในเทอมของ p·d ในสนามไฟฟ้าสม่ำเสมอ","คือความสัมพันธ์ของ Ub อยู่ในเทอมของ p·d ในสนามไฟฟ้าใดๆก็ได้","คือความสัมพันธ์ของ Ub อยู่ในเทอมของ p·r ในสนามไฟฟ้าไม่สม่ำเสมอ","คือความสัมพันธ์ของ Ub อยู่ในเทอมของ p·r ของอิเล็กโตรดที่มีมิติที่พอเหมาะ"],0];

RAW[216]=["จากสมการคำนวณแรงดันเบรกดาวน์ในก๊าซ Ub=Eb·d·η*p เมื่อกำหนดความคงทนต่อแรงดันของก๊าซ Eb ระยะแกป d แฟกเตอร์สนามไฟฟ้า η*(η*>30%) ทำไมค่าแรงดันเบรกดาวน์ Ub จึงเพิ่มขึ้นตามการเพิ่มความดันก๊าซ p",["เพราะว่าโมเลกุลหนาแน่นมากขึ้น ทำให้อิเล็กตรอนไปจับเกาะบนโมเลกุลหมด","เพราะว่าเมื่อ p เพิ่มสูงขึ้น ทำให้อุณหภูมิลดลงเกิดไอออไนเซชันยากขึ้น","เพราะว่าเมื่อ p เพิ่มสูงขึ้นระยะอิสระเฉลี่ย λ ลดลง ไอออไนเซชันจะเกิดได้ยากขึ้น","ถูกทุกข้อ"],2];

RAW[234]=["ความเครียดสนามไฟฟ้าเบรกดาวน์ของอากาศในสนามไฟฟ้าสม่ำเสมอระนาบ-ระนาบขึ้นอยู่กับระยะแกป d และอธิบายได้ด้วยสมการมาตรฐาน Eb=24.4+6.72/√d kV/cm ถามว่าที่ระยะแกปแคบค่า Eb ต้องมีค่าสูง แต่ที่ระยะแกปห่างมากขึ้น Eb จะมีค่าลดลงเพราะเหตุใด",["เพราะว่า Ub=Eb·d มีค่าคงที่ทุกระยะแกป","เพราะการเกิดไอออไนเซชันได้ อิเล็กตรอนต้องเคลื่อนที่ให้ได้พลังงาน ≥ wi","พลังงานไอออไนเซชัน wi ขึ้นอยู่กับความเครียดสนามไฟฟ้า E และระยะแกป d","คำตอบ 2 และ 3 ถูกต้อง"],3];
RAW[235]=["การเกิดเบรกดาวน์ของก๊าซในแกปที่มีสนามไฟฟ้าไม่สม่ำเสมอเล็กน้อยด้วยแรงดันอิมพัลส์รูปคลื่นฟ้าผ่า ปริมาณอิเล็กตรอนอิสระในแกปมีมากหรือน้อย มีผลต่อเวลาล่าช้า (time lag) และค่าแรงดันเบรกดาวน์ Ub อย่างไร",["อิเล็กตรอนอิสระมีมาก time lag จะสั้น ทำให้ Ub มีค่าต่ำ","อิเล็กตรอนอิสระมีน้อย time lag จะยาว ทำให้ Ub มีค่าสูง","อิเล็กตรอนอิสระมีมากหรือน้อย time lag จะสั้นและยาวตามลำดับแต่ไม่มีผลต่อ Ub","อิเล็กตรอนอิสระมีมากหรือน้อยไม่มีผลต่อ time lag และไม่มีผลต่อ Ub"],3];

RAW[351]=["เซอร์กิตเบรกเกอร์ตัดกระแสสร้างสนามแม่เหล็กของหม้อแปลงไฟฟ้ากำลัง 3 เฟส 24kV 50Hz มีค่าเก็บประจุ 2500pF และความเหนี่ยวนำ L=14.7H ถ้ากระแสถูกตัดขณะไม่มีโหลดเท่ากับ 3A จงหาแรงดันตกคร่อมหน้าสัมผัส",["68kV","48kV","230kV","136kV"],2];
RAW[352]=["เซอร์กิตเบรกเกอร์ตัดตัวเก็บประจุ capacitor bank ระบบ 3 เฟส 24kV 50Hz นิวตรัลต่อลงดิน คำนวณหาแรงดันเกินคร่อมหน้าสัมผัสเซอร์กิตเบรกเกอร์จะได้อย่างน้อย",["24√2 kV","(48√2)/√3 kV","48/√3 kV","48√2 kV"],1];
RAW[353]=["เซอร์กิตเบรกเกอร์ (CB) ตัดวงจรเก็บประจุ capacitor bank ที่ใช้ชดเชยแฟกเตอร์กำลัง อาจเกิดแรงดันเกินเสิร์จสวิตชิ่งคร่อมหน้าสัมผัส CB ได้ถึง 3 เท่าของแรงดันใช้งานปกตินั้น เกิดขึ้นได้อย่างไร",["เกิดขึ้นได้ถ้ามีการอาร์กซ้ำ (restriking) เมื่อ CB ตัดวงจร","เกิดขึ้นเมื่อโหลดแบบเหนี่ยวนำถูกตัดออกหมดทันที","เกิดขึ้นเมื่อนิวตรัลของระบบที่ต่อลงดินโดยตรงเกิดขาด","เกิดขึ้นเมื่อสายเฟสหนึ่งเกิดขาด"],0];
RAW[354]=["ระบบส่งจ่ายแรงสูง 3 เฟส 50Hz นิวตรัลต่อลงดินโดยตรง ถ้าเกิดเฟสหนึ่งผิดพร่องลงดินโดยตรง จะทำให้เกิดแรงดันเกินที่เฟสใด เป็นแบบใดถ้าเซอร์กิตเบรกเกอร์ยังไม่ตัดวงจรเฟสที่ผิดพร่อง",["เกิดแรงดันเกินเฟสที่ผิดพร่องลงดิน เนื่องจากกระแสผิดพร่องมีค่าสูง","เกิดแรงดันเกินเฟสที่ไม่ผิดพร่องมีค่าเป็น 2เท่าของค่ายอดเฟส","เกิดแรงดันเกินเฟสที่ไม่ผิดพร่อง จะมีค่าไม่เกิน 80% ของแรงดันเฟส-เฟส","เกิดแรงดันเกินเฟสที่ไม่ผิดพร่องเท่ากับแรงดันเฟส-เฟส"],2];
RAW[355]=["ระบบส่งจ่ายแรงสูง 3 เฟส 50Hz นิวตรัลต่อลงดินโดยตรง ถ้าเกิดเฟสหนึ่งผิดพร่องลงดินโดยตรง ทำให้เซอร์กิตเบรกเกอร์ทำงานตัดวงจรผิดพร่อง จะเกิดแรงดันเกินที่เฟสใดสูงสุด และเป็นแบบใด",["เกิดแรงดันเกินเสิร์จแบบสวิตชิ่ง มีค่าสูง 2เท่าของค่ายอดเฟส หรือมากกว่าถ้าเกิดอาร์กซ้ำที่หน้าสัมผัสเซอร์กิตเบรกเกอร์","เกิดแรงดันเกินเสิร์จแบบสวิตชิ่ง มีค่าเท่ากับแรงดันเฟส-เฟสที่เฟสผิดพร่อง","เกิดแรงดันเกินแบบสวิตชิ่งมีค่าไม่เกิน 80% ของแรงดันเฟส-เฟส บนเฟสผิดพร่อง","เกิดแรงดันเกินเสิร์จสวิตชิ่งเท่ากันทุกเฟสมีค่าเท่ากับ 2เท่าค่ายอดเฟส"],0];
RAW[356]=["ปรากฎการณ์ back flashover คืออะไร",["ปรากฎการณ์ของฟ้าผ่าชนิดหนึ่ง","ฟ้าผ่าโดยตรงเข้าที่สายส่งแรงสูง","ฟ้าผ่าจากพื้นโลกขึ้นไปที่ชั้นบรรยากาศ","ฟ้าผ่าที่ลงสายดินแล้วทำให้แรงดันเกินเสิร์จวาบไฟย้อนกลับเข้าที่สายส่ง"],3];
RAW[357]=["Ferranti effect คืออะไร",["แรงดันเกินชั่วครู่แบบรีโซแนนซ์","การเกิดผิดพร่องลงดินแบบไม่สมดุล","การสับสวิตช์บนสายส่งระยะไกลที่ปลายทางไม่มีโหลดทำให้เกิดแรงดันเกินที่ปลายทาง","การปลดโหลดเต็มที่แบบเหนี่ยวนำออกไป แล้วเพิ่มโหลดแบบเก็บประจุเข้าไปทันทีทันใด"],2];
RAW[358]=["เบรกเกอร์ตัดกระแสที่สร้างสนามแม่เหล็ก ของหม้อแปลงสามเฟส 24kV,50Hz พิกัด 2,000kVA ที่ 2.5A มีค่าเก็บประจุ C=2000pF จะเกิดแรงดันตกคร่อมหน้าสัมผัสของเบรกเกอร์เท่าไร",["170kV","235kV","228kV","198kV"],1];
RAW[359]=["อุปกรณ์ไฟฟ้าที่จะนำไปใช้ในระบบ 3เฟส 230kV,50Hz จะต้องทำการทดสอบ BIL ตามมาตรฐาน IEC ซึ่งกำหนดไว้หลายค่า ขึ้นอยู่กับการต่อนิวตรัลลงดินโดยตรง จงกำหนดแรงดันทดสอบ BIL",["650 kV","750 kV","850 kV","1050 kV"],0];
RAW[360]=["ที่ระดับแรงดันใช้งานกับกับดักเสิร์จ (surge arrester) ชนิดใดต่อไปนี้มีค่ากระแสรั่วไหลผ่านความต้านทาน ไม่เป็นเชิงเส้นของกับดัก (Rnon) น้อยกว่า 1mA",["SiC","ZnO","MgO","Ar"],1];
RAW[361]=["ข้อใดต่อไปนี้ที่จำเป็นต้องรู้สำหรับการเลือกระดับแรงดันป้องกันของกับดัก",["ค่าแรงดัน BIL ของระบบ","ค่าแรงดันสปาร์คหางคลื่นที่สูงสุดของรูปคลื่น 1.2/50 ไมโครวินาที","ค่าแรงดันที่เหลือค้างสูงสุดคร่อมกับดักที่กระแสกำหนดกับดักคือ 5kA หรือ 10kA","ถูกทุกข้อ"],3];
RAW[362]=["เมื่อคลื่นจร (travelling wave) ที่มีขนาด 100kV เคลื่อนที่ในสายส่งไปทางด้านที่มีปลายเปิด ที่ปลายเปิดนี้จะมีค่าแรงดันเป็นเท่าใด",["50 kV","100 kV","150 kV","200 kV"],3];
RAW[363]=["ผลของเฟอร์รันตี้ (Ferranti effect) ที่เกิดขึ้นในสายส่งขึ้นอยู่กับอะไร",["กระแสที่ไหลผ่านชั้นท์แบบเก็บประจุของสายส่ง","กระแสที่ไหลผ่านความเหนี่ยวนำของสายส่ง","ความยาวของสายส่ง","ถูกทุกข้อ"],2];
RAW[364]=["ข้อใดไม่ใช่ผลกระทบจากฟ้าผ่า (Lightning Effect)",["ผลทางความร้อน","ผลทางความดันบรรยากาศ","ผลทางไฟฟ้า","ผลทางกล"],1];
RAW[365]=["ข้อใดคือคุณสมบัติของฉนวนแข็ง",["ระบายความร้อนได้ดี","ฉนวนมีความแทรกซึมได้ดี","กลับคืนสู่สภาพความเป็นฉนวนไม่ได้เมื่อเสื่อมสภาพ","ปรับค่าความเป็นฉนวนเพิ่มขึ้นได้"],2];
RAW[366]=["ข้อใดไม่ใช่ส่วนประกอบภายในกับดักฟ้าผ่า",["Linear Resistors","Non-linear Resistors","SiC","ZnO"],0];
RAW[367]=["ข้อใดไม่ใช่คุณสมบัติของกับดักฟ้าผ่าแบบ ZnO",["ไม่มีแกปข้างใน","รับพลังงานเพิ่มได้โดยการต่อกับดักฟ้าผ่าแบบขนาน","ความเปรอะเปื้อนไม่มีผลต่อการทำงาน","มีกระแสไหลตาม (follow current) เมื่อแรงดันเสิร์จผ่านไป"],3];
RAW[368]=["ข้อใดไม่ใช่ลักษณะของแรงดันเกินชั่วครู่ (Temporary Overvoltage : TOV)",["ความถี่อาจสูงกว่าหรือต่ำกว่าความถี่พลังงาน","เป็นแรงดันเกินที่มีลักษณะของออสซิลเลชัน","ความถี่ของออสซิลเลชันจะเท่ากับความถี่พลังงาน","ความถี่จะมีออสซิลเลชันสูงซ้อนความถี่ระบบ"],3];

/* ---------- SECTION 8 : 69 Lightning protection (369-400) ---------- */
RAW[369]=["ในระบบป้องกันฟ้าผ่าการติดตั้งตัวนำลงดินจะต้องมีให้เกิดวาบไฟด้านข้าง (side flash) ท่านเข้าใจหลักการนี้อย่างไร",["ตัวนำลงดินจะต้องมีค่าอิมพีแดนซ์ต่ำ และมีค่าเหนี่ยวนำน้อย","หากอาคารมีความกว้างยาวมาก ต้องใช้ตัวนำลงดินหลายๆเส้นขนานกัน","หากอาคารมีความสูงมากๆ ต้องมีการเชื่อมโยงตัวนำลงดินที่ขนานกันในช่วงกลางของความสูง","ถูกทุกข้อ"],3];
RAW[370]=["ตัวนำล่อฟ้าของระบบป้องกันที่มีความต้านทานดินต่างกัน จะให้ประสิทธิผลการล่อฟ้าต่างกันอย่างไร",["เสาล่อฟ้าที่มีความต้านทานดินสูงจะสร้างสตรีมเมอร์ได้ยาวกว่า ทำให้มีบริเวณป้องกันมากยิ่งขึ้น","เสาล่อฟ้าที่มีความต้านทานดินสูงจะสร้างสตรีมเมอร์ได้ยาวกว่า ทำให้มีบริเวณป้องกันน้อยลง","เสาล่อฟ้าที่มีความต้านทานดินต่ำจะสร้างสตรีมเมอร์ได้ยาวกว่า ทำให้มีบริเวณป้องกันมากยิ่งขึ้น","เสาล่อฟ้าที่มีความต้านทานดินต่ำจะสร้างสตรีมเมอร์ได้ยาวกว่า ทำให้มีบริเวณป้องกันน้อยลง"],2];
RAW[371]=["รากสายดินแบบแท่งกลมยาว 3เมตร เส้นผ่านศูนย์กลาง 5ซม. ฝังลงในดินที่มีความต้านทานจำเพาะ 200โอห์ม-เมตร จงคำนวณหาความต้านทานดิน",["38 โอห์ม","48 โอห์ม","58 โอห์ม","68 โอห์ม"],2];
RAW[372]=["รากสายดินเป็นเส้นทองแดงแบนหนา 3.5มม. กว้าง 35มม. ยาว 100เมตร ความต้านทานจำเพาะของดินเท่ากับ 200โอห์ม-เมตร จงคำนวณหาความต้านทานดิน",["3.7 โอห์ม","4.7 โอห์ม","5.7 โอห์ม","6.7 โอห์ม"],2];
RAW[373]=["โดยทั่วไปฟ้าผ่าจะเริ่มต้นในก้อนเมฆที่มีประจุสะสม ซึ่งมีการกระจายของประจุ โดยที่ฐานของก้อนเมฆมีประจุเป็นลบ ส่วนบนของก้อนเมฆมีประจุเป็นบวก อยากทราบว่าจุดเริ่มต้นของการเกิดฟ้าผ่ามักจะเกิดขึ้นจากจุดใดเป็นส่วนใหญ่",["เกิดที่ฐานของก้อนเมฆที่มีประจุลบ","เกิดจากส่วนบนของก้อนเมฆที่มีประจุบวก","เกิดจากตรงรอยต่อระหว่างประจุบวกกับลบในก้อนเมฆ","ถูกทุกข้อ"],0];
RAW[374]=["ระยะฟ้าผ่าซึ่งเป็นระยะช่วงสุดท้ายของหัวนำร่องที่จะวิ่งเข้าหาวัตถุที่อยู่ใกล้ที่สุดจะมีค่าโดยเฉลี่ยประมาณเท่าใด",["10 เมตร","50 เมตร","100 เมตร","150 เมตร"],1];
RAW[375]=["การเกิดฟ้าผ่ามักก่อให้เกิดความเสียหายทั้งทางตรงและทางอ้อม จึงต้องมีการป้องกัน ใครเป็นผู้แนะนำให้ใช้เสาล่อฟ้าเป็นคนแรกของโลก",["D'Alibard","J. Priestley","B. Franklin","A. Spencer"],2];
RAW[376]=["การติดตั้งเสาล่อฟ้าด้วยวิธีทรงกลมกลิ้ง (rolling sphere) คือการใช้ทรงกลมกลิ้งบนหรือรอบบริเวณสิ่งที่จะป้องกันจนสัมผัสพื้นดินและสิ่งอยู่เหนือดิน ถ้าสัมผัสจุดใดจุดนั้นต้องติดตั้งตัวนำล่อฟ้า ตามข้อกำหนดของมาตรฐาน IEC ทรงกลมกลิ้งมีรัศมีเท่าใด",["รัศมีเท่ากับความสูงของสิ่งที่จะป้องกันที่สูงสุด","รัศมีเท่ากับครึ่งหนึ่งของความสูงของสิ่งที่จะป้องกันที่สูงสุด","รัศมีเท่ากับระยะฟ้าผ่า (striking distance)","รัศมีเท่ากับ 100 เมตร"],2];
RAW[377]=["การติดตั้งตัวนำล่อฟ้าด้วยวิธีทรงกลมกลิ้ง (rolling sphere) ตามข้อกำหนดมาตรฐาน IEC เกี่ยวข้องกับข้อใด",["ขนาดกระแสฟ้าผ่าและระดับป้องกัน","ระยะฟ้าผ่า (striking distance)","บริเวณป้องกัน (protective space)","ถูกทุกข้อ"],3];
RAW[378]=["ตัวนำล่อฟ้า คืออะไร คำอธิบายข้อใดถูกต้อง",["คือตัวนำอาจเป็นแท่งหรือสายตัวนำ ที่ทำหน้าที่รับฟ้าผ่าหรือล่อให้ฟ้าผ่าที่ตัวนำล่อฟ้าถ้าจะมีฟ้าผ่าขึ้นในบริเวณนั้น","คือตัวนำที่ก่อให้เกิดปรากฏการณ์ฟ้าผ่าขึ้น","คือตัวนำที่มีความต้านทานสูงเพื่อจำกัดกระแสฟ้าผ่าให้มีค่าน้อยลง","คือตัวนำที่มีปลายแหลมติดตั้งบนเสาฉนวนเพื่อให้มีความเครียดสนามไฟฟ้าสูง เป็นการเพิ่มประสิทธิภาพการล่อฟ้าให้ดีขึ้น"],0];

/* ================== SECTION DEFINITIONS ================== */
function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const SECTIONS = [
  {id:'s1', name:'62-Generation and uses of high voltage (1-89)', range: range(1,89)},
  {id:'s2', name:'63-High-Voltage measurement techniques (90-149)', range: range(90,149)},
  {id:'s3', name:'64-Electric field and insulation techniques (149-194)', range: range(149,194)},
  {id:'s4', name:'65-Breakdown of gas (195-248)', range: range(195,248)},
  {id:'s5', name:'66-Liquid and solid dielectrics (249-293)', range: range(249,293)},
  {id:'s6', name:'67-Test of high-voltage material and equipment (294-344)', range: range(294,344)},
  {id:'s7', name:'68-Liquid and switching overvoltages (345-368)', range: range(345,368)},
  {id:'s8', name:'69-Lightning protection (369-400)', range: range(369,400)},
  {id:'sp1', name:'พิเศษ 1 (1-194)', range: range(1,194), special:true},
  {id:'sp2', name:'พิเศษ 2 (195-400)', range: range(195,400), special:true},
  {id:'sp3', name:'พิเศษ 3 (1-194 สลับ)', range: shuffle(range(1,194)), special:true},
  {id:'sp4', name:'พิเศษ 4 (195-400 สลับ)', range: shuffle(range(195,400)), special:true},
];

/* ================== APP LOGIC ================== */
let currentSection = null;
let answered = {}; // qNum -> chosenIndex

function buildTabs(){
  const tabsDiv = document.getElementById('tabs');
  SECTIONS.forEach(sec=>{
    const btn = document.createElement('button');
    btn.textContent = sec.name;
    btn.className = sec.special ? 'special' : '';
    btn.onclick = ()=>loadSection(sec);
    btn.id = 'tab_'+sec.id;
    tabsDiv.appendChild(btn);
  });
}

function loadSection(sec){
  currentSection = sec;
  answered = {};
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab_'+sec.id).classList.add('active');
  document.getElementById('finalResult').style.display='none';
  document.getElementById('scoreBar').style.display='flex';
  renderQuestions();
  updateScore();
  window.scrollTo(0,0);
}

function renderQuestions(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  const title = document.createElement('div');
  title.className='sectionTitle';
  title.textContent = currentSection.name + ' — ทั้งหมด ' + currentSection.range.length + ' ข้อ';
  area.appendChild(title);

  currentSection.range.forEach((qNum, idx)=>{
    const data = RAW[qNum];
    if(!data) return;
    const [qText, choices, ansIdx] = data;
    const block = document.createElement('div');
    block.className='qBlock';
    block.id = 'qblock_'+qNum;

    const numDiv = document.createElement('div');
    numDiv.className='qNum';
    numDiv.textContent = 'ข้อที่ '+(idx+1)+' (ต้นฉบับข้อ '+qNum+')';
    block.appendChild(numDiv);

    const qDiv = document.createElement('div');
    qDiv.className='qText';
    qDiv.textContent = qText;
    block.appendChild(qDiv);

    // question image
    const img = document.createElement('img');
    img.className='qImg';
    img.src = 'q'+qNum+'.png';
    img.onerror = function(){ this.style.display='none'; };
    block.appendChild(img);

    choices.forEach((choiceText, ci)=>{
      const btn = document.createElement('button');
      btn.className='choice';
      btn.dataset.qnum = qNum;
      btn.dataset.idx = ci;

      const txt = document.createElement('div');
      txt.textContent = (ci+1)+'. '+choiceText;
      btn.appendChild(txt);

      const cimg = document.createElement('img');
      cimg.className='choiceImg';
      cimg.src = 'q'+qNum+'_'+(ci+1)+'.png';
      cimg.onerror = function(){ this.style.display='none'; };
      btn.appendChild(cimg);

      btn.onclick = ()=>selectAnswer(qNum, ci, ansIdx, block);
      block.appendChild(btn);
    });

    area.appendChild(block);
  });
}

function selectAnswer(qNum, chosenIdx, correctIdx, block){
  if(answered[qNum] !== undefined) return; // already answered
  answered[qNum] = chosenIdx;
  const btns = block.querySelectorAll('.choice');
  btns.forEach(b=>{
    b.classList.add('disabled');
    const idx = parseInt(b.dataset.idx);
    if(idx === correctIdx){
      b.classList.add('correct');
    } else if(idx === chosenIdx && chosenIdx !== correctIdx){
      b.classList.add('wrong');
    }
  });
  updateScore();
}

function updateScore(){
  const total = currentSection.range.length;
  let correct = 0;
  currentSection.range.forEach(qNum=>{
    if(answered[qNum] !== undefined){
      const ansIdx = RAW[qNum][2];
      if(answered[qNum] === ansIdx) correct++;
    }
  });
  const answeredCount = Object.keys(answered).length;
  document.getElementById('scoreText').textContent = 'ตอบแล้ว '+answeredCount+'/'+total+' | ถูก '+correct+' ข้อ';
}

function submitAll(){
  const total = currentSection.range.length;
  let correct = 0;
  let unanswered = 0;
  currentSection.range.forEach(qNum=>{
    if(answered[qNum] === undefined){
      unanswered++;
      // reveal correct answer for unanswered ones too
      const block = document.getElementById('qblock_'+qNum);
      const ansIdx = RAW[qNum][2];
      const btns = block.querySelectorAll('.choice');
      btns.forEach(b=>{
        b.classList.add('disabled');
        if(parseInt(b.dataset.idx) === ansIdx) b.classList.add('correct');
      });
    } else if(answered[qNum] === RAW[qNum][2]){
      correct++;
    }
  });
  const percent = ((correct/total)*100).toFixed(1);
  const resDiv = document.getElementById('finalResult');
  resDiv.style.display='block';
  resDiv.innerHTML = 'คะแนนรวม: '+correct+' / '+total+' ('+percent+'%)'+
    (unanswered>0 ? '<br><span style="font-size:14px;color:#c53030;">ยังไม่ได้ตอบ '+unanswered+' ข้อ (ระบบเฉลยให้อัตโนมัติ)</span>' : '');
  window.scrollTo({top:0, behavior:'smooth'});
}

buildTabs();
loadSection(SECTIONS[0]);
</script>
</body>
