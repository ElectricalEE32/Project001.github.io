const state = Object.fromEntries(quizData.map(c=>[c.id, c.questions.map(()=>({answered:false, choice:null}))]));
let current = 0;

function escapeHtml(s){
  return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c));
}
function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  quizData.forEach((c,i)=>{
    const done=state[c.id].filter(x=>x.answered).length;
    const btn=document.createElement('button');
    btn.className='tab-btn px-4 py-2 rounded-xl border border-slate-200 bg-white text-sm font-medium hover:border-blue-400';
    if(i===current) btn.classList.add('active');
    btn.innerHTML=`${i===6 ? 'รวม W1–W6' : 'W'+(i+1)} <span class="text-xs text-slate-400">(${done}/${c.questions.length})</span>`;
    btn.onclick=()=>{current=i; renderAll(); window.scrollTo({top:0,behavior:'smooth'});};
    el.appendChild(btn);
  });
}
function renderQuestion(c, qi){
  const q=c.questions[qi], s=state[c.id][qi];
  const card=document.createElement('section'); card.className='bg-white rounded-2xl shadow-sm border p-5';
  let options='';
  q.options.forEach((opt,oi)=>{
    let cls='option-card rounded-xl p-4 cursor-pointer bg-white';
    if(s.answered){ if(oi===q.correct) cls+=' correct'; else if(oi===s.choice) cls+=' wrong'; }
    options += `<button class="${cls} w-full text-left" ${s.answered?'disabled':''} onclick="answer(${qi},${oi})"><span class="font-semibold mr-2">${String.fromCharCode(65+oi)}.</span>${escapeHtml(opt)}</button>`;
  });
  const status=s.answered ? (s.choice===q.correct ? '<span class="text-green-600 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i>ถูกต้อง</span>' : '<span class="text-red-600 font-semibold"><i class="fa-solid fa-circle-xmark mr-1"></i>ไม่ถูกต้อง</span>') : '';
  card.innerHTML=`
    <div class="flex flex-col gap-3">
      <div class="flex justify-between gap-3"><h3 class="font-bold text-lg leading-relaxed">${escapeHtml(q.q)}</h3><div class="text-sm">${status}</div></div>
      <div class="grid gap-3">${options}</div>
      ${s.answered ? `
        <div class="mt-2 p-4 rounded-xl bg-indigo-50"><div class="font-semibold text-indigo-800 mb-1">เฉลย / อธิบาย</div><div class="text-sm leading-relaxed">${escapeHtml(q.explain)}</div></div>
        <div class="source-box mt-2 p-4 rounded-xl"><div class="text-xs font-semibold text-indigo-700 uppercase tracking-wide mb-1">แหล่งอ้างอิงจากสไลด์</div><div class="text-sm">${escapeHtml(q.source)}</div></div>` : ''}
    </div>`;
  return card;
}
function renderAll(){
  renderTabs();
  const c=quizData[current];
  document.getElementById('chapter-title').textContent=c.title;
  document.getElementById('chapter-desc').textContent=c.desc;
  const qs=document.getElementById('questions'); qs.innerHTML='';
  c.questions.forEach((_,i)=>qs.appendChild(renderQuestion(c,i)));
  const score=state[c.id].reduce((a,s,i)=>a+(s.answered&&s.choice===c.questions[i].correct?1:0),0);
  document.getElementById('chapter-score').textContent=`${score} / ${c.questions.length}`;
  document.getElementById('total-score').textContent=quizData.reduce((sum,ch)=>sum+state[ch.id].reduce((a,s,i)=>a+(s.answered&&s.choice===ch.questions[i].correct?1:0),0),0);
  document.getElementById('total-max').textContent=quizData.reduce((s,c)=>s+c.questions.length,0);
}
function answer(qi, choice){
  const c=quizData[current]; if(state[c.id][qi].answered)return;
  state[c.id][qi]={answered:true,choice}; renderAll();
  document.getElementById('questions').children[qi]?.scrollIntoView({behavior:'smooth',block:'center'});
}
document.getElementById('reset-btn').onclick=()=>{state[quizData[current].id]=quizData[current].questions.map(()=>({answered:false,choice:null})); renderAll();};
renderAll();
</script>
