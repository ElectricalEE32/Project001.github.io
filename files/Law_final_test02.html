<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบวิชากฎหมาย (Law Final) - ชุดที่ 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 400px;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .progress {
            text-align: right;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .question-block {
            padding: 20px;
            background-color: #fafafa;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .question-text {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #fff;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #e8f4f8;
            border-color: #3498db;
        }
        .option-btn:disabled {
            cursor: default;
        }
        .correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
            font-weight: bold;
        }
        .incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }
        .rationale {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #e2e3e5;
            border-radius: 6px;
            font-size: 0.95em;
            color: #383d41;
            border-left: 4px solid #6c757d;
        }
        #next-btn {
            display: none;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            float: right;
            transition: background-color 0.3s;
        }
        #next-btn:hover {
            background-color: #2980b9;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        #result-container {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .score-text {
            font-size: 2.5em;
            color: #27ae60;
            font-weight: bold;
            margin: 20px 0;
        }
        .btn-restart {
            padding: 12px 30px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-restart:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container clearfix">
    <h1>แบบทดสอบวิชากฎหมาย (LAW IN DAILY LIFE) - ชุดที่ 2</h1>
    
    <div id="quiz-area">
        <div class="progress" id="progress-text">ข้อ 1 / 40</div>
        <div class="question-block" id="question-block">
            <div class="question-text" id="question-text"></div>
            <ul class="options-list" id="options-list"></ul>
            <div class="rationale" id="rationale-text"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">ข้อถัดไป</button>
    </div>

    <div id="result-container">
        <h2>สรุปผลคะแนนของคุณ</h2>
        <div class="score-text" id="final-score"></div>
        <p>เก่งมาก! หวังว่าแบบทดสอบชุดนี้จะช่วยให้คุณทบทวนความรู้ได้ยอดเยี่ยมยิ่งขึ้น</p>
        <button class="btn-restart" onclick="location.reload()">ทำแบบทดสอบอีกครั้ง</button>
    </div>
</div>

<script>
    // ข้อมูลคำถาม ตัวเลือก และเฉลย (a=0, b=1, C=2, d=3, e=4)
    const quizData = [
        { q: "1. ข้อใด \"ไม่ใช่\" เครื่องหมายการค้า", options: ["a. เครื่องหมายบริการ", "b. เครื่องหมายรับรอง", "C. เครื่องหมายประกัน", "d. เครื่องหมายร่วม", "e. เครื่องหมายการค้า"], ans: 2, exp: "เฉลย: C. เครื่องหมายประกัน ไม่มีนิยามตามกฎหมายเครื่องหมายการค้า" },
        { q: "2. ข้อใด \"ไม่ใช่\" คดีผู้บริโภค", options: ["a. คดีแพ่งระหว่างนายโทกับผู้ประกอบธุรกิจรถยนต์ที่ส่งมอบรถยนต์ ที่ไม่ได้มาตรฐาน", "b. คดีแพ่งระหว่างนายตรีกับบริษัททัวร์ประเทศจีนที่ผิดสัญญานำเที่ยว", "C. คดีอาญาที่นายฝนขับรถขนสินค้าของบริษัทชนนายเมฆที่เป็นเดินข้ามถนน", "d. คดีแพ่งระหว่างนายเอกที่รับบริการสายการบินไทยแอร์แต่ไม่ได้บินเพราะเครื่องบินเสีย", "e. คดีแพงที่นายฟ้าฟ้องบริษัทผลิตน้ำยาล้างห้องน้ำ"], ans: 2, exp: "เฉลย: C. คดีขับรถชนคนเดินถนนเป็นคดีอาญาและละเมิดทั่วไป ไม่ใช่ข้อพิพาทจากการบริโภคสินค้าหรือบริการ" },
        { q: "3. ข้อใดต่อไปนี้ \"ไม่ใช่\" สิทธิบัตร", options: ["a. สิทธิบัตรการประดิษฐ์ในผลิตภัณฑ์", "b. สิทธิบัตรการประดิษฐ์ในกรรมวิธี", "C. อนุสิทธิบัตร", "d. สิทธิบัตรการสร้างสรรค์", "e. สิทธิบัตรการออกแบบผลิตภัณฑ์"], ans: 3, exp: "เฉลย: d. สิทธิบัตรการสร้างสรรค์ (กฎหมายมีแค่ สิทธิบัตรการประดิษฐ์, สิทธิบัตรการออกแบบ และอนุสิทธิบัตร)" },
        { q: "4. นายเอกอยู่กินกับนางทิพย์โดยมิได้จดทะเบียนสมรสหลังจากนั้นได้คลอดเด็กชายหลิว ถามว่าเด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของใคร", options: ["a. เด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของนางทิพย์เท่านั้น", "b. เด็กชายหลิวไม่เป็นบุตรที่ชอบด้วยกฎหมายของใคร", "C. เด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของนายเอกคนเดียว", "d. เด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของนางทิพย์และนายเอก", "e. เด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของนางทิพย์ต่อเมื่อมีคำสั่งของศาลเท่านั้น"], ans: 0, exp: "เฉลย: a. บุตรที่เกิดจากหญิงที่ไม่ได้จดทะเบียนสมรส เป็นบุตรชอบด้วยกฎหมายของหญิง(มารดา) ฝ่ายเดียวเสมอ" },
        { q: "5. กฎหมายวิธีพิจารณาคดี กรณีเกิดข้อพิพาททางแพ่งระหว่างผู้บริโภคกับผู้ประกอบธุรกิจที่ใช้บังคับอยู่ในปัจจุบัน คือกฎหมายใด", options: ["a. พระราชบัญญัติว่าด้วยข้อสัญญาที่ไม่เป็นธรรม พ.ศ.2540", "b. ประมวลกฎหมายวิธีพิจารณาความอาญา", "C. พระราชบัญญัติคุ้มครองผู้บริโภคพ.ศ.2522", "d. พระราชบัญญัติวิธีพิจารณาคดีผู้บริโภค พ.ศ.2551", "e. ประมวลกฎหมายวิธีพิจารณาความแพ่ง"], ans: 2, exp: "เฉลย: C. (หมายเหตุ: อิงตามคีย์เฉลยที่คุณต้องการ แต่ตามหลักกฎหมายที่แท้จริง กฎหมายวิธีพิจารณาคดีคือข้อ d. พ.ร.บ.วิธีพิจารณาคดีผู้บริโภค พ.ศ. 2551 ครับ)" },
        { q: "6. ข้อใดต่อไปนี้กล่าวถูกต้องเกี่ยวกับสัญญาเช่าซื้อ", options: ["a. สัญญาเช่าซื้อไม่ต้องทำตามแบบ...", "b. สัญญาเช่าซื้อผู้ให้เช่าซื้อไม่จำเป็นต้องเป็นเจ้าของ...", "C. สัญญาเช่าซื้อเป็นสัญญาที่ผู้เช่าซื้อมีสิทธิได้ใช้ทรัพย์สินที่เช่าซื้อเท่านั้น...", "d. สัญญาเช่าซื้อเป็นสัญญาที่กรรมสิทธิ์ในทรัพย์สินไม่มีทางโอน...", "e. สัญญาเช่าซื้อเป็นสัญญาที่เจ้าของเอาทรัพย์สินออกให้เช่าและให้คำมั่นว่าจะขายหรือให้ทรัพย์สินนั้นตกเป็นสิทธิแก่ผู้เช่าซื้อ"], ans: 4, exp: "เฉลย: e. เป็นนิยามที่ถูกต้องที่สุดของสัญญาเช่าซื้อตาม ป.พ.พ." },
        { q: "7. การจำนองที่ไม่ทำตามแบบที่กฎหมายกำหนดไว้ ผลเป็นอย่างไร", options: ["a. ไม่สมบูรณ์", "b. โมฆะ", "C. สมบูรณ์", "d. ฟ้องร้องบังคับคดีไม่ได้", "e. โมฆยะ"], ans: 1, exp: "เฉลย: b. การจำนองต้องทำเป็นหนังสือและจดทะเบียน หากฝ่าฝืนตกเป็น 'โมฆะ'" },
        { q: "8. นายเอกเป็นบิดาบุญธรรมของนายหนึ่ง และเป็นบุตรโดยชอบด้วยกฎหมายของนายเอกับนางบี หลังจากนั้นนายเอกตาย ถามว่าใครมีสิทธิรับมรดกของนายเอกผู้ตาย", options: ["a. นายหนึ่ง", "b. นายเอกับนางบี", "C. วัดอันเป็นภูมิลำเนา", "d. นายเอกับนางบีและนายหนึ่ง", "e. แผ่นดิน"], ans: 3, exp: "เฉลย: d. ทั้งบุตรบุญธรรม (นายหนึ่ง) และบิดามารดาเดิม (เอ, บี) มีสิทธิรับมรดกทั้งคู่ในฐานะทายาทโดยธรรม" },
        { q: "9. ข้อความใดต่อไปนี้ เป็นการฝ่าฝืนต่อกฎหมายคุ้มครองผู้บริโภค", options: ["a. หน้าขาวกระจ่างใสอย่างเป็นธรรมชาติ", "b. อร่อยดีทั่วไทย เก็บไว้คู่ครัว", "C. ช่องเจ็ดสีทีวีเพื่อคุณ", "d. ช่วยลดอาการเสียวฟันได้", "e. ขาหมูนางรอง อร่อยที่สุดในโลก"], ans: 4, exp: "เฉลย: e. เป็นการโฆษณาที่ใช้ข้อความเกินความจริง (Overclaim)" },
        { q: "10. ผู้ตายมีภริยาและมีทายาทลำดับที่ 2 ด้วย ภริยาของผู้ตายจะได้ส่วนแบ่งในการแบ่งมรดกเท่าใด", options: ["a. ได้ 2 ใน 3", "b. ได้คนละส่วนเท่าๆ กัน", "c. ได้ 1 ใน 3", "d. ได้ 2 ใน 5", "e. ได้ 1 ใน 2"], ans: 4, exp: "เฉลย: e. คู่สมรสรับมรดกร่วมกับทายาทลำดับ 2 (บิดามารดา) จะได้รับส่วนแบ่งกึ่งหนึ่ง (1 ใน 2)" },
        { q: "11. ข้อใดต่อไปนี้ใช้เป็นเครื่องหมายในเครื่องหมายการค้าที่จะขอจดทะเบียน\"ไม่ได้\"", options: ["a. ข้อความ", "b. กลิ่น", "C. ชื่อบุคคล", "d. เสียง", "e. รูปถ่าย"], ans: 1, exp: "เฉลย: b. ตามกฎหมายไทย ปัจจุบันยังไม่สามารถนำ 'กลิ่น' มาจดทะเบียนเป็นเครื่องหมายการค้าได้" },
        { q: "12. ผู้ใด \"ไม่มี\" อำนาจฟ้องคดีผู้บริโภค", options: ["a. คณะกรรมการคุ้มครองผู้บริโภค", "b. สมาคมที่คณะกรรมการคุ้มครองผู้บริโภครับรอง", "C. เจ้าพนักงานตำรวจ", "d. ผู้บริโภค", "e. ผู้มีอำนาจฟ้องแทนผู้บริโภค"], ans: 2, exp: "เฉลย: C. เจ้าพนักงานตำรวจไม่มีอำนาจฟ้องร้องคดีผู้บริโภค(ทางแพ่ง) แทนประชาชน" },
        { q: "13. สัญญาเช่าที่ไม่มีกำหนดระยะเวลา หากต้องการบอกเลิกสัญญาต้องบอกกล่าวล่วงหน้าอย่างน้อยเท่าใด", options: ["a. ไม่จำเป็นต้องบอกกล่าวเพราะไม่มีกำหนดระยะเวลา", "b. อย่างน้อย 1 เดือน", "C. อย่างน้อยหนึ่งชั่วกำหนดระยะเวลาในการชำระค่าเช่า", "d. อย่างน้อย 15 วัน", "e. อย่างน้อย 30 วัน"], ans: 2, exp: "เฉลย: C. ต้องบอกกล่าวล่วงหน้าอย่างน้อยหนึ่งชั่วกำหนดระยะเวลาการชำระค่าเช่า" },
        { q: "14. ข้อใดคือแบบของสัญญาจำนอง", options: ["a. มีหลักฐานเป็นหนังสือลงลายมือชื่อผู้จำนอง", "b. ทําเป็นหนังสือ", "C. ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่", "d. จดทะเบียนต่อพนักงานเจ้าหน้าที่", "e. ทําเป็นหนังสือต่อพนักงานเจ้าหน้าที่"], ans: 2, exp: "เฉลย: C. การจำนองต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ มิฉะนั้นเป็นโมฆะ" },
        { q: "15. เมื่อเจ้ามรดกเสียชีวิต บุคคลใดดังต่อไปนี้เป็นผู้ได้รับมรดก", options: ["a. ลุง ป้า", "b. ปู่ ย่า", "C. พี่น้องร่วมบิดาและมารดา", "d. บิดามารดา", "e. พี่น้องร่วมแต่บิดาเดียวกัน"], ans: 3, exp: "เฉลย: d. บิดามารดา เป็นทายาทลำดับ 2 ซึ่งมีสิทธิได้รับมรดกในลำดับต้นๆ ก่อนญาติพี่น้องอื่นๆ ในตัวเลือก" },
        { q: "16. ผู้ใด \"ไม่ใช่\" ผู้บริโภคตามพระราชบัญญัติคุ้มครองผู้บริโภค พ.ศ.2522", options: ["a. นายฟ้าซื้อสินค้าจากห้างสรรพสินค้า", "b. นางแก้วเข้ารับบริการนวดเท้าที่ร้านสปา", "C. นายชัยซื้อรองเท้ามือสองต่อจากเพื่อน", "d. นายเอกซื้อรถยนต์กับบริษัทก่อไกร จำกัด", "e. นางเรไรทำบัตรเครดิตกับบริษัทเงินด่วน"], ans: 4, exp: "เฉลย: e. (หมายเหตุ: อิงตามคีย์เฉลยที่คุณระบุมาครับ)" },
        { q: "17. ถ้าผู้เช่าตามสัญญาเช่าทรัพย์ตายสัญญาเช่าจะเป็นอย่างไร", options: ["a. สัญญาเช่าไม่ระงับผูกพันทายาทผู้เช่าและผู้ให้เช่าต่อไป", "b. สัญญาเช่าเป็นสิทธิในทางทรัพย์สินตกทอดแก่ทายาท", "C. สัญญาเช่ายังคงมีผลผูกพันคู่สัญญาต่อไป", "d. สัญญาเช่าเป็นอันระงับสิ้นไปไม่ตกทอดแก่ทายาทผู้เช่า", "e. สัญญาเช่าไม่ระงับผูกพันผู้ให้เช่าต่อไป"], ans: 3, exp: "เฉลย: d. สัญญาเช่าถือเอาคุณสมบัติผู้เช่าเป็นสำคัญ หากผู้เช่าตาย สัญญาเช่าระงับทันที" },
        { q: "18. “มะขามหวานเพรชบูรณ์” จัดเป็นทรัพย์สินทางปัญญาประเภทใด", options: ["a. สิ่งบ่งชี้ทางภูมิศาสตร์", "b. เครื่องหมายการค้า", "C. สิทธิบัตร", "d. ความลับทางการค้า", "e. การคุ้มครองพันธุ์พืช"], ans: 0, exp: "เฉลย: a. เป็นชื่อที่แสดงถึงแหล่งที่มาทางภูมิศาสตร์ที่ส่งผลต่อคุณภาพสินค้านั้น (GI)" },
        { q: "19. ข้อใด \"ไม่ใช่\" ทรัพย์สินทางปัญญา", options: ["a. แผนผังภูมิวงจรรวม", "b. สิทธิบัตร", "C. ลิขสิทธิ์", "d. เครื่องหมายการค้า", "e. ข้อมูลการบริหารสิทธิ"], ans: 4, exp: "เฉลย: e. ข้อมูลการบริหารสิทธิ ไม่ใช่ประเภทของทรัพย์สินทางปัญญาโดยตรง แต่เป็นข้อมูลประกอบการบริหารลิขสิทธิ์" },
        { q: "20. ผู้ให้เช่าซื้อบอกเลิกสัญญาเช่าซื้อได้เมื่อปรากฏว่าผู้เข้าซื้อผิดนักไม่ชาระเงินก็คราว", options: ["a. 2 คราวไม่จำเป็นต้องติดกัน", "b. 2 คราวติด ๆ กัน", "c. 3 คราวติด ๆ กัน", "d. 3 คราวไม่จำเป็นต้องติดกัน", "e. บอกเลิกเมื่อใดก็ได้"], ans: 1, exp: "เฉลย: b. ต้องผิดนัดชำระค่าเช่าซื้อ 2 งวดติดต่อกัน ผู้ให้เช่าซื้อจึงจะบอกเลิกสัญญาได้" },
        { q: "21. ข้อใดต่อไปนี้จำนองได้", options: ["a. นาฬิกา", "b. รถยนต์", "C. โน็ตบุ๊ค", "d. เรือพาย", "e. แหวน"], ans: 1, exp: "เฉลย: b. รถยนต์ เป็นสังหาริมทรัพย์ชนิดพิเศษที่สามารถนำไปจดทะเบียนจำนองได้" },
        { q: "22. กฎหมายว่าด้วยเรื่องครอบครัว \"ไม่ใช้\" กับผู้นับถือศาสนาอิสลามในจังหวัดใด", options: ["a. จังหวัดปัตตานี", "b. จังหวัดพังงา", "C. จังหวัดกรุงเทพฯ", "d. จังหวัดระยอง", "e. จังหวัดชุมพร"], ans: 0, exp: "เฉลย: a. ปัตตานี (รวมถึงนราธิวาส ยะลา สตูล) ใช้กฎหมายอิสลามว่าด้วยครอบครัวและมรดกแทน ป.พ.พ." },
        { q: "23. สิทธิบัตรมีอายุการคุ้มครองก็ปี", options: ["a. 15 ปี", "b. 50 ปี", "c. 20 ปี", "d. 10 ปี", "e. 6 ปี"], ans: 2, exp: "เฉลย: c. สิทธิบัตรการประดิษฐ์ มีอายุความคุ้มครอง 20 ปี" },
        { q: "24. การเช่าตามข้อใดต้องทําเป็นหนังสือและจดทะเบียน", options: ["a. เช่าที่ดิน 2 ปี", "b. เช่าบ้านพร้อมที่ดินตลอดชีวิตของผู้เช่า", "C. เช่าเรือขนส่งสินค้า 5 ปี", "d. เช่าบ้าน 3 ปี", "e. เช่ารถยนต์ 5 ปี"], ans: 1, exp: "เฉลย: b. การเช่าอสังหาริมทรัพย์ที่เกิน 3 ปี หรือตลอดอายุผู้เช่า ต้องทำเป็นหนังสือและจดทะเบียน" },
        { q: "25. แบบของสัญญาเช่าซื้อคืออะไร", options: ["a. จดทะเบียนต่อพนักงานเจ้าหน้าที่", "b. ทำเป็นหนังสือต่อพนักงานเจ้าหน้าที", "C. ทำเป็นหนังสือและจดทะเบียน", "d. ทำหลักฐานเป็นหนังสือ", "e. ทำเป็นหนังสือลงลายมือชื่อคู่สัญญา"], ans: 4, exp: "เฉลย: e. สัญญาเช่าซื้อต้องทำเป็นหนังสือ มิฉะนั้นตกเป็นโมฆะ" },
        { q: "26. ข้อใดต่อไปนี้คือจํานอง", options: ["a. การใช้ตำแหน่งประกันการชำระหนี้", "b. การนำสังหาริมทรัพย์ไปตราไว้เป็นประกันการชำระหนี้", "C. การใช้บุคคลประกันการชำระหนี้", "d. การส่งมอบสังหาริมทรัพย์ไว้เป็นประกันการชำระหนี้", "e. การนำทรัพย์สินไปตราไว้เป็นประกันการชำระหนี้"], ans: 4, exp: "เฉลย: e. จำนองคือการนำอสังหาริมทรัพย์ (หรือสังหาริมทรัพย์พิเศษ) ไปจดทะเบียนตราไว้เป็นประกันหนี้" },
        { q: "27. อายุการคุ้มครองลิขสิทธิ์ ตามข้อใด \"ไม่ถูกต้อง\"", options: ["a. หากโฆษณาครั้งแรกเกิดขึ้นภายหลังผู้สร้างสรรค์ถึงแก่ความตายคุ้มครอง 50 ปี...", "b. 50 ปีนับแต่ผู้สร้างสรรค์ถึงแก่ความตาย", "C. งานศิลปประยุกต์คุ้มครอง 50 ปีนับแต่สร้างสรรค์หรือโฆษณาครั้งแรก", "d. งานภาพยนตร์คุ้มครอง 50 ปีนับแต่สร้างสรรค์หรือโฆษณาครั้งแรก", "e. งานภาพถ่ายคุ้มครอง 50 ปีนับแต่สร้างสรรค์หรือโฆษณาครั้งแรก"], ans: 2, exp: "เฉลย: C. งานศิลปประยุกต์มีอายุการคุ้มครองเพียง 25 ปี (ไม่ใช่ 50 ปี)" },
        { q: "28. ข้อใด \"ไม่ใช่\" สิทธิของผู้บริโภคที่จะได้รับความคุ้มครองตามกฎหมายคุ้มครองผู้บริโภค", options: ["a. สิทธิได้รับข่าวสาร...", "b. สิทธิที่จะมีอิสระ...", "C. สิทธิได้รับความปลอดภัย...", "d. สิทธิได้รับการพิจารณาและชดเชยความเสียหาย", "e. สิทธิได้รับการปฏิบัติอย่างไม่เป็นธรรมในการทำสัญญา"], ans: 4, exp: "เฉลย: e. กฎหมายคุ้มครองให้ได้รับความเป็นธรรม ไม่ใช่สิทธิที่จะได้รับความ 'ไม่เป็นธรรม'" },
        { q: "29. ทรัพย์ตามข้อใดจำนำ \"ไม่ได้\"", options: ["a. ช้าง", "b. รถยนต์", "C. โทรทัศน์", "d. แหวน", "e. ทีดิน"], ans: 4, exp: "เฉลย: e. ที่ดินเป็นอสังหาริมทรัพย์ ต้องใช้วิธีจดทะเบียน 'จำนอง' จำนำไม่ได้" },
        { q: "30. นายด่าตกลงให้นายแดงเช่าบ้านมีกำหนด 10 ปี โดยทำหลักฐานเป็นหนังสือ แต่มิได้จดทะเบียน ต่อพนักงานเจ้าหน้าที จะมีผลอย่างไรตามกฎหมาย", options: ["a. ฟ้องร้องบังคับคดีกันได้เพียง 3 ปี", "b. สัญญาเช่าตกเป็นโมฆะ", "C. ฟ้องร้องบังคับคดีกันได้ 10 ปี", "d. ฟ้องร้องบังคับคดีกันไม่ได้เลย", "e. สัญญาเช่าตกเป็นโมฆยะ"], ans: 0, exp: "เฉลย: a. การเช่าอสังหาริมทรัพย์เกิน 3 ปี หากไม่จดทะเบียนจะฟ้องร้องบังคับคดีได้แค่ 3 ปีแรกเท่านั้น" },
        { q: "31. สัญญาค้ำประกันต้องดำเนินการอย่างใดจึงจะสามารถฟ้องร้องบังคับคดีกันได้", options: ["a. ทำสัญญากันปากเปล่าก็เพียงพอแล้ว", "b. ต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้กู้และผู้ให้กู้", "C. ต้องทำเป็นหนังสือลงลายมือชื่อคู่สัญญา", "d. ต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้ค้ำประกัน", "e. ต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่"], ans: 3, exp: "เฉลย: d. สัญญาค้ำประกันต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้ค้ำประกันเป็นสำคัญ" },
        { q: "32. ทรัพย์สินที่ฝ่ายชายมอบไว้ให้แก่หญิง เพื่อเป็นหลักฐานการหมั้น และเป็นหลักประกันว่าชายจะสมรสกับหญิงในอนาคต เรียกว่าอะไร", options: ["a. ของหมั้น", "b. สินสอด", "C. สินบน", "d. สินสมรส", "e. ค่าเลี้ยงดู"], ans: 0, exp: "เฉลย: a. ของหมั้น" },
        { q: "33. ข้อใดไม่เป็นเหตุที่ทำให้ภริยาฟ้องหย่าสามีได้", options: ["a. นายสุทธิราชสามีของนางสมหญิง กลายเป็นคนวิกลจริตรักษามา 1 ปีแล้วก็ไม่หาย", "b. นางจิตตราตกลงแยกกันอยู่กับนายจิตติสามี เป็นระยะเวลา 5 ปีแล้ว", "C. นายมะเขือสามีของนางมะขาม มีสภาพแห่งกายที่ไม่อาจจะร่วมประเวณีกับภริยาได้ตลอดกาล", "d. นางจรรยาภริยาของนายฉลอง มีชู้", "e. นายมะพร้าวสามีของนางส้มโอ มีเมียน้อย"], ans: 0, exp: "เฉลย: a. วิกลจริตต้องเป็นมาเกิน 3 ปี และยากจะรักษาหายขาด จึงจะเป็นเหตุฟ้องหย่าได้" },
        { q: "34. ในฉลากต้องมีข้อความดังต่อไปนี้ยกเว้นข้อใด", options: ["a. ชื่อบริษัทเครือข่ายของผู้ผลิต", "b. ชื่อของผู้ผลิต", "C. ข้อความที่จำเป็นเช่น ราคา ปริมาณ วิธีใช้ ข้อแนะนำ", "d. เครื่องการค้าของผู้ผลิต", "e. สถานที่ผลิต"], ans: 1, exp: "เฉลย: b. (หมายเหตุ: อิงตามคีย์เฉลยที่คุณต้องการครับ แต่ในทางกฎหมายจริงๆ บังคับให้ต้องแสดงชื่อผู้ผลิตครับ ข้อที่ถูกตามหลักการคือข้อ a.)" },
        { q: "35. ข้อใดต่อไปนี้ \"ไม่ใช่\" งานอันมีลิขสิทธิ์", options: ["a. โปรแกรมคอมพิวเตอร์", "b. ภาพยนตร์", "C. ท่าเต้นประกอบเพลง", "d. นวนิยาย", "e. เครื่องฉายแสงโปรตรอน"], ans: 4, exp: "เฉลย: e. สิ่งประดิษฐ์ทางวิทยาศาสตร์อย่างเครื่องฉายแสง ต้องขอรับความคุ้มครองผ่าน 'สิทธิบัตร'" },
        { q: "36. สินค้าประเภทใดที่ได้รับการยกเว้นไม่ต้องติดฉลาก", options: ["a. สินค้าที่ผลิตขึ้นเพื่อส่งออกและไม่มีขายในประเทศไทย", "b. สินค้าที่ผลิตโดยโรงงาน", "C. สินค้าที่ประชาชนทั่วไปใช้เป็นประจำ", "d. สินค้าที่อาจเป็นอันตราย", "e. สินค้าที่สั่งเข้ามาในราชอาณาจักร"], ans: 0, exp: "เฉลย: a. สินค้าผลิตเพื่อการส่งออกเท่านั้น จะได้รับการยกเว้นหลักเกณฑ์เรื่องฉลาก" },
        { q: "37. ทรัพย์สินระหว่างสามีภริยามีกีประเภท", options: ["a. 3 ประเภท คือ สินส่วนตัว, สินสมรสและสินสอด", "b. 2 ประเภท คือ หนี้สินและทรัพย์สิน", "c. 2 ประเภท คือ ทรัพยสิทธิกับบุคคลสิทธิ", "d. 2 ประเภท คือ สินส่วนตัวกับสินบริคณห์สนธิ", "e. 2 ประเภท คือ สินส่วนตัวกับสินสมรส"], ans: 4, exp: "เฉลย: e. ตามกฎหมายครอบครัว ทรัพย์สินระหว่างสามีภรรยาแบ่งเป็น สินส่วนตัว และ สินสมรส" },

    let currentQuestionIndex = 0;
    let score = 0;

    const progressText = document.getElementById("progress-text");
    const questionText = document.getElementById("question-text");
    const optionsList = document.getElementById("options-list");
    const rationaleText = document.getElementById("rationale-text");
    const nextBtn = document.getElementById("next-btn");
    const quizArea = document.getElementById("quiz-area");
    const resultContainer = document.getElementById("result-container");
    const finalScoreText = document.getElementById("final-score");

    function loadQuestion() {
        rationaleText.style.display = "none";
        nextBtn.style.display = "none";
        optionsList.innerHTML = "";
        
        const qData = quizData[currentQuestionIndex];
        
        progressText.innerText = `ข้อ ${currentQuestionIndex + 1} / ${quizData.length}`;
        questionText.innerText = qData.q;
        rationaleText.innerText = qData.exp;

        if (currentQuestionIndex === quizData.length - 1) {
            nextBtn.innerText = "ดูผลคะแนนรวม";
        } else {
            nextBtn.innerText = "ข้อถัดไป";
        }

        qData.options.forEach((optText, index) => {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optText;

            btn.onclick = () => selectOption(btn, index, qData.ans);
            
            li.appendChild(btn);
            optionsList.appendChild(li);
        });
    }

    function selectOption(selectedBtn, selectedIndex, correctIndex) {
        const allButtons = optionsList.querySelectorAll(".option-btn");
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("incorrect");
            allButtons[correctIndex].classList.add("correct");
        }

        rationaleText.style.display = "block";
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizArea.style.display = "none";
        resultContainer.style.display = "block";
        finalScoreText.innerText = `คุณทำได้ ${score} / ${quizData.length} คะแนน`;
    }

    loadQuestion();

</script>
