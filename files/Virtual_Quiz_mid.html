// build "all" (รวมข้อสอบบทที่ 1-6) from available chapters
const allQuestions = [];
["ch2","ch3","ch4","ch5","ch6"].forEach(key=>{
  quizData[key].questions.forEach(q=>{
    allQuestions.push(Object.assign({}, q, {chLabel: quizData[key].label}));
  });
});
quizData.all = {
  label: "รวมข้อสอบ",
  title: "รวมข้อสอบบทที่ 1-6",
  note: "หมายเหตุ: ในไฟล์ต้นฉบับที่ได้รับมามีข้อสอบของบทที่ 2-6 เท่านั้น (ไม่พบข้อสอบของบทที่ 1) หน้านี้จึงรวมข้อสอบจากบทที่ 2-6 ทั้งหมดไว้ด้วยกัน",
  questions: allQuestions
};

const tabOrder = [
  {key:'ch2', label:'บทที่ 2 Virtual Ontology'},
  {key:'ch3', label:'บทที่ 3 Hyperhistory'},
  {key:'ch4', label:'บทที่ 4 Digital Law'},
  {key:'ch5', label:'บทที่ 5 Virtual Education'},
  {key:'ch6', label:'บทที่ 6 Game'},
  {key:'all', label:'รวมข้อสอบบทที่ 1-6'},
];

// ================== RENDER ==================
const tabsEl = document.getElementById('tabs');
const containerEl = document.getElementById('container');

tabOrder.forEach((t, i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0 ? ' active' : '');
  btn.textContent = t.label;
  btn.dataset.key = t.key;
  btn.onclick = ()=> switchTab(t.key);
  tabsEl.appendChild(btn);

  const section = document.createElement('div');
  section.className = 'section' + (i===0 ? ' active' : '');
  section.id = 'sec-' + t.key;
  containerEl.appendChild(section);

  renderSection(t.key);
});

function switchTab(key){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='sec-'+key));
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderSection(key){
  const data = quizData[key];
  const section = document.getElementById('sec-'+key);
  section.innerHTML = '';

  const h = document.createElement('div');
  h.className = 'section-title';
  h.textContent = data.title;
  section.appendChild(h);

  if(data.note){
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = data.note;
    section.appendChild(note);
  }

  const scoreBar = document.createElement('div');
  scoreBar.className = 'score-bar';
  scoreBar.innerHTML = '<span>คะแนน: <span class="score-num" id="score-'+key+'">0</span> / '+data.questions.length+'</span>';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-btn';
  resetBtn.textContent = 'ทำใหม่';
  resetBtn.onclick = ()=> renderSection(key);
  scoreBar.appendChild(resetBtn);
  section.appendChild(scoreBar);

  let score = 0;

  data.questions.forEach((q, idx)=>{
    const card = document.createElement('div');
    card.className = 'q-card';

    const tag = document.createElement('div');
    tag.className = 'q-tag';
    tag.textContent = q.chLabel ? q.chLabel : '';
    if(q.chLabel) card.appendChild(tag);

    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.innerHTML = '<span class="q-num">'+(idx+1)+'</span>' + q.text;
    card.appendChild(qText);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';

    const options = q.type === 'tf' ? ['True','False'] : q.options;

    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    options.forEach((optText, optIdx)=>{
      const optBtn = document.createElement('button');
      optBtn.className = 'opt-btn';
      optBtn.textContent = (q.type==='mc' ? (optIdx+1)+'. ' : '') + optText;
      optBtn.onclick = ()=>{
        if(optBtn.classList.contains('locked')) return;
        const allBtns = optsWrap.querySelectorAll('.opt-btn');
        allBtns.forEach(b=>b.classList.add('locked'));

        if(optIdx === q.correct){
          optBtn.classList.add('correct');
          card.classList.add('answered-correct');
          feedback.textContent = 'ถูกต้อง!';
          feedback.className = 'feedback ok';
          score++;
        } else {
          optBtn.classList.add('wrong');
          allBtns[q.correct].classList.add('correct');
          card.classList.add('answered-wrong');
          feedback.textContent = 'ไม่ถูกต้อง — คำตอบที่ถูกต้องคือข้อที่ทำเครื่องหมายสีเขียว';
          feedback.className = 'feedback no';
        }
        document.getElementById('score-'+key).textContent = score;
      };
      optsWrap.appendChild(optBtn);
    });

    card.appendChild(optsWrap);
    card.appendChild(feedback);
    section.appendChild(card);
  });
}
</script>
