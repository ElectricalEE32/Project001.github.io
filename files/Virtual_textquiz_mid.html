        let currentTab = 'tab1';
        let isShowAnswerMode = false;
        let userAnswers = {};

        const tabTitles = {
            tab1: "แท็บ 1: Virtual Ontology (ภววิทยาของความเป็นจริงเสมือน)",
            tab2: "แท็บ 2: Hyperhistory (ประวัติศาสตร์และเทคโนโลยีสารสนเทศ)",
            tab3: "แท็บ 3: Digital Law (กฎหมายดิจิทัลและ PDPA)",
            tab4: "แท็บ 4: Virtual Education (การศึกษาในยุค Postdigital & Big Data)",
            tab5: "แท็บ 5: Games (ปรัชญา ประวัติศาสตร์ และอุตสาหกรรมเกม)",
            tab6: "แท็บ 6: ข้อสอบรวม บทที่ 1 - 5 (Comprehensive Exam)"
        };

        function initQuiz() {
            userAnswers = { tab1: {}, tab2: {}, tab3: {}, tab4: {}, tab5: {}, tab6: {} };
            renderQuiz();
        }

        function switchTab(tabKey) {
            currentTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tabKey}`).classList.add('active');
            
            document.getElementById('currentChapterTitle').innerText = tabTitles[tabKey];
            document.getElementById('questionCountInfo').innerText = `(${quizData[tabKey].length} ข้อ)`;
            
            renderQuiz();
            updateScoreDisplay();
        }

        function toggleMode() {
            isShowAnswerMode = !isShowAnswerMode;
            const btn = document.getElementById('modeToggleBtn');
            if (isShowAnswerMode) {
                btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> โหมดทำข้อสอบ';
                btn.className = 'bg-amber-600 hover:bg-amber-700 text-white text-sm px-4 py-2 rounded-lg shadow transition flex items-center gap-2';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-eye"></i> โหมดเฉลย & คำอธิบาย';
                btn.className = 'bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg shadow transition flex items-center gap-2';
            }
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const questions = quizData[currentTab];

            questions.forEach((item, index) => {
                const qCard = document.createElement('div');
                qCard.className = 'bg-white p-6 rounded-xl shadow-sm border border-slate-200 transition hover:shadow-md';

                let optionsHTML = '';
                item.options.forEach((opt, optIdx) => {
                    let optClass = "border border-slate-200 hover:bg-slate-50 cursor-pointer";
                    let iconHTML = `<span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs mr-3 font-semibold">${String.fromCharCode(65 + optIdx)}</span>`;
                    
                    const selectedOpt = userAnswers[currentTab][index];

                    if (isShowAnswerMode) {
                        if (optIdx === item.ans) {
                            optClass = "bg-emerald-50 border-emerald-500 text-emerald-900 font-medium";
                            iconHTML = `<span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs mr-3"><i class="fa-solid fa-check"></i></span>`;
                        } else if (selectedOpt === optIdx && selectedOpt !== item.ans) {
                            optClass = "bg-rose-50 border-rose-400 text-rose-900";
                            iconHTML = `<span class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs mr-3"><i class="fa-solid fa-xmark"></i></span>`;
                        }
                    } else {
                        if (selectedOpt === optIdx) {
                            if (selectedOpt === item.ans) {
                                optClass = "bg-emerald-50 border-emerald-500 text-emerald-900 font-medium";
                                iconHTML = `<span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs mr-3"><i class="fa-solid fa-check"></i></span>`;
                            } else {
                                optClass = "bg-rose-50 border-rose-400 text-rose-900";
                                iconHTML = `<span class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs mr-3"><i class="fa-solid fa-xmark"></i></span>`;
                            }
                        }
                    }

                    optionsHTML += `
                        <div onclick="selectAnswer(${index}, ${optIdx})" class="p-3 rounded-lg text-sm flex items-center transition ${optClass} mb-2">
                            ${iconHTML}
                            <span>${opt}</span>
                        </div>
                    `;
                });

                let rationaleHTML = '';
                if (isShowAnswerMode || userAnswers[currentTab][index] !== undefined) {
                    rationaleHTML = `
                        <div class="mt-4 p-4 bg-indigo-50/70 rounded-lg border border-indigo-100 text-xs text-indigo-950">
                            <span class="font-bold flex items-center gap-1 mb-1 text-indigo-900">
                                <i class="fa-solid fa-lightbulb text-amber-500"></i> เฉลย & คำอธิบายตามสไลด์:
                            </span>
                            <p class="leading-relaxed">${item.rationale}</p>
                        </div>
                    `;
                }

                qCard.innerHTML = `
                    <div class="font-semibold text-slate-800 text-base mb-4">${item.q}</div>
                    <div class="space-y-1">${optionsHTML}</div>
                    ${rationaleHTML}
                `;

                container.appendChild(qCard);
            });

            updateScoreDisplay();
        }

        function selectAnswer(qIndex, optIndex) {
            if (isShowAnswerMode) return; // Disable clicking in show mode
            userAnswers[currentTab][qIndex] = optIndex;
            renderQuiz();
        }

        function updateScoreDisplay() {
            const questions = quizData[currentTab];
            let score = 0;
            questions.forEach((item, index) => {
                if (userAnswers[currentTab][index] === item.ans) {
                    score++;
                }
            });
            document.getElementById('currentScore').innerText = score;
            document.getElementById('totalQuestions').innerText = questions.length;
        }

        function exportToText() {
            let output = `==================================================\n`;
            output += `คลังข้อสอบวิชา IST20 1510 Virtual Community (90 ข้อ)\n`;
            output += `==================================================\n\n`;

            Object.keys(quizData).forEach(tabKey => {
                output += `--------------------------------------------------\n`;
                output += `${tabTitles[tabKey]}\n`;
                output += `--------------------------------------------------\n\n`;

                quizData[tabKey].forEach((item, idx) => {
                    output += `${item.q}\n`;
                    item.options.forEach((opt, oIdx) => {
                        const letter = String.fromCharCode(65 + oIdx);
                        output += `  ${letter}. ${opt}\n`;
                    });
                    const correctLetter = String.fromCharCode(65 + item.ans);
                    output += `  [เฉลย]: ข้อ ${correctLetter}\n`;
                    output += `  [คำอธิบาย]: ${item.rationale}\n\n`;
                });
            });

            navigator.clipboard.writeText(output).then(() => {
                alert('คัดลอกข้อสอบทั้ง 6 แท็บ (90 ข้อ) พร้อมเฉลยและคำอธิบายลง Clipboard เรียบร้อยแล้ว!\nสามารถนำไป Paste (Ctrl+V) ใน Notepad หรือ Word ได้เลย');
            }).catch(err => {
