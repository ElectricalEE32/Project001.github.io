<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบวิชากฎหมาย (Law Final)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 400px;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .progress {
            text-align: right;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .question-block {
            padding: 20px;
            background-color: #fafafa;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .question-text {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #fff;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #e8f4f8;
            border-color: #3498db;
        }
        .option-btn:disabled {
            cursor: default;
        }
        .correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
            font-weight: bold;
        }
        .incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }
        .rationale {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #e2e3e5;
            border-radius: 6px;
            font-size: 0.95em;
            color: #383d41;
            border-left: 4px solid #6c757d;
        }
        #next-btn {
            display: none; /* ซ่อนไว้ก่อนจนกว่าจะตอบ */
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            float: right;
            transition: background-color 0.3s;
        }
        #next-btn:hover {
            background-color: #2980b9;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        #result-container {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .score-text {
            font-size: 2.5em;
            color: #27ae60;
            font-weight: bold;
            margin: 20px 0;
        }
        .btn-restart {
            padding: 12px 30px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-restart:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container clearfix">
    <h1>แบบทดสอบวิชากฎหมาย (LAW IN DAILY LIFE)</h1>
    
    <div id="quiz-area">
        <div class="progress" id="progress-text">ข้อ 1 / 40</div>
        <div class="question-block" id="question-block">
            <div class="question-text" id="question-text"></div>
            <ul class="options-list" id="options-list"></ul>
            <div class="rationale" id="rationale-text"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">ข้อถัดไป</button>
    </div>

    <div id="result-container">
        <h2>สรุปผลคะแนนของคุณ</h2>
        <div class="score-text" id="final-score"></div>
        <p>เก่งมาก! หวังว่าแบบทดสอบนี้จะช่วยให้คุณทบทวนความรู้ได้ดียิ่งขึ้น</p>
        <button class="btn-restart" onclick="location.reload()">ทำแบบทดสอบอีกครั้ง</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "1. ข้อใดต่อไปนี้กล่าวถูกต้องเกี่ยวกับสัญญาเช่าซื้อ", options: ["ก. สัญญาเช่าซื้อไม่ต้องทำตามแบบแต่อย่างใดเพียงตกลงกันด้วยวาจาสัญญาเช่าซื้อก็เกิดและมีผลสมบูรณบังคับกันได้ตามกฎหมาย", "ข. สัญญาเช่าซื้อผู้ให้เช่าซื้อไม่จำเป็นต้องเป็นเจ้าของกรรมสิทธิ์ในทรัพย์สินที่เช่าซื้อ", "ค. สัญญาเช่าซื้อเป็นสัญญาที่ผู้เช่าซื้อมีสิทธิ์ได้ใช้ทรัพย์สินที่เช่าซื้อเท่านั้นผู้เช่าซื้อไม่มีทางได้กรรมสิทธิ์ในทรัพย์สินที่เช่าซื้อ", "ง. สัญญาเช่าซื้อเป็นสัญญาที่กรรมสิทธิ์ในทรัพย์สินไม่มีทางโอนไปยังผู้เช่าซื้อ", "จ. สัญญาเช่าซื้อเป็นสัญญาที่เจ้าของเอาทรัพย์สินออกให้เช่าและให้คำมั่นว่าจะขายหรือให้ ทรัพย์สินนั้นตกเป็นสิทธิแก่ผู้เช่าซื้อ"], ans: 4, exp: "เฉลย: จ. สัญญาเช่าซื้อคือสัญญาที่เจ้าของนำทรัพย์สินออกให้เช่า และให้คำมั่นว่าจะขายหรือให้ทรัพย์สินนั้นตกเป็นกรรมสิทธิ์ของผู้เช่าเมื่อชำระเงินครบตามที่ตกลง" },
        { q: "2. ข้อใด “ไม่ใช่” คดีผู้บริโภค", options: ["ก. คดีแพ่งระหว่างนายโทกับผู้ประกอบธุรกิจรถยนต์ที่ส่งมอบรถยนต์ ที่ไม่ได้มาตรฐาน", "ข. คดีแพ่งระหว่างนายตรีกับบริษัททัวร์ประเทศจีนที่ผิดสัญญานำเที่ยว", "ค. คดีอาญาที่นายฝนขับรถขนสินค้าของบริษัทขนนายเมฆที่เป็นที่ดินเดินข้ามถนน", "ง. คดีแพ่งระหว่างนายเอกที่รับบริการสายการบินไทยแอร์แต่ไม่ได้บินเพราะเครื่องบินเสีย", "จ. คดีแพ่งที่นายฟาฟ้องบริษัทผลิตน้ำยาล้างห้องน้ำ"], ans: 2, exp: "เฉลย: ค. คดีผู้บริโภคส่วนใหญ่เป็นคดีแพ่งระหว่างผู้บริโภคกับผู้ประกอบธุรกิจ กรณีขับรถชนเป็นคดีละเมิด/คดีอาญาจราจรทั่วไป" },
        { q: "3. ข้อใด “ไม่ใช่” ทรัพย์สินทางปัญญา", options: ["ก. แผนผังภูมิวงจรรวม", "ข. สิทธิบัตร", "ค. ลิขสิทธิ์", "ง. เครื่องหมายการค้า", "จ. ข้อมูลการบริหารสิทธิ"], ans: 4, exp: "เฉลย: จ. ข้อมูลการบริหารสิทธิ เป็นข้อมูลที่ใช้ประกอบการบริหารจัดการสิทธิ แต่ไม่ใช่ประเภทของตัวทรัพย์สินทางปัญญาหลักๆ" },
        { q: "4. การเช่าตามข้อใดต้องทำเป็นหนังสือและจดทะเบียน", options: ["ก. เช่าที่ดิน 2 ปี", "ข. เช่าบ้านพร้อมที่ดินตลอดชีวิตของผู้เช่า", "ค. เช่าเรือขนสินค้า 5 ปี", "ง. เช่าบ้าน 3 ปี", "จ. เช่ารถยนต์ 5 ปี"], ans: 1, exp: "เฉลย: ข. การเช่าอสังหาริมทรัพย์ที่เกินกว่า 3 ปี หรือตลอดอายุของผู้เช่า ต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่" },
        { q: "5. ทรัพย์สินที่ฝ่ายชายมอบไว้ให้แก่ฝ่ายหญิง เพื่อเป็นหลักฐานการหมั้น และเป็นหลักประกันว่าชายจะสมรสกับหญิงในอนาคต เรียกว่าอะไร", options: ["ก. ของหมั้น", "ข. สินสอด", "ค. สินบน", "ง. สินสมรส", "จ. ค่าเลี้ยงดู"], ans: 0, exp: "เฉลย: ก. ของหมั้น (ส่วนสินสอดคือทรัพย์สินที่ให้แก่บิดามารดาฝ่ายหญิงเพื่อตอบแทนการยอมให้สมรส)" },
        { q: "6. นายดำตกลงให้นายแดงเช่าบ้านมีกำหนด 10 ปี โดยทำหลักฐานเป็นหนังสือแต่มิได้จดทะเบียนต่อพนักงานเจ้าหน้าที่จะมีผลอย่างไรตามกฎหมาย", options: ["ก. ฟ้องร้องบังคับคดีกันได้เพียง 3 ปี", "ข. สัญญาเช่าตกเป็นโมฆะ", "ค. ฟ้องร้องบังคับคดีกันได้ 10 ปี", "ง. ฟ้องร้องบังคับคดีกันไม่ได้เลย", "จ. สัญญาเช่าตกเป็นโมมียะ"], ans: 0, exp: "เฉลย: ก. การเช่าอสังหาริมทรัพย์เกิน 3 ปี ถ้าไม่จดทะเบียน จะฟ้องร้องบังคับคดีได้เพียง 3 ปีเท่านั้น" },
        { q: "7. สินค้าประเภทใดที่ได้รับการยกเว้นไม่ต้องติดฉลาก", options: ["ก. สินค้าที่ผลิตขึ้นเพื่อส่งออกและไม่มีขายในประเทศไทย", "ข. สินค้าที่ผลิตโดยโรงงาน", "ค. สินค้าที่ประชาชนทั่วไปใช้เป็นประจำ", "ง. สินค้าที่อาจเป็นอันตราย", "จ. สินค้าที่สั่งเข้ามาในราชอาณาจักร"], ans: 0, exp: "เฉลย: ก. สินค้าที่ผลิตเพื่อการส่งออกเท่านั้น ได้รับการยกเว้นตามกฎหมายคุ้มครองผู้บริโภคเรื่องฉลาก" },
        { q: "8. สัญญาเช่าซื้อหากไม่ทำตามแบบที่กฎหมายกำหนด สัญญานั้นจะมีผลอย่างไร", options: ["ก. เป็นโมฆะ", "ข. เป็นโมมียะ", "ค. สมบูรณ์", "ง. ผูกพันกันตลอดไป", "จ. ไม่สมบูรณ์"], ans: 0, exp: "เฉลย: ก. สัญญาเช่าซื้อกฎหมายบังคับว่าต้องทำเป็นหนังสือ มิฉะนั้นจะตกเป็นโมฆะ" },
        { q: "9. ในฉลากต้องมีข้อความดังต่อไปนี้ยกเว้นข้อใด", options: ["ก. ชื่อบริษัทเครือข่ายของผู้ผลิต", "ข. ชื่อของผู้ผลิต", "ค. ข้อความที่จำเป็นเช่น ราคา ปริมาณ วิธีใช้ข้อแนะนำ", "ง. เครื่องการค้าของผู้ผลิต", "จ. สถานที่ผลิต"], ans: 1, exp: "เฉลย: ข. ตามเฉลยที่ให้มาคือ ข. (แต่อาจหมายถึงการระบุชื่อผู้ผลิตมีรายละเอียดเฉพาะเจาะจงอื่นๆ หรือเป็นข้อยกเว้นบางประการในตัวเลือกของข้อสอบนี้)" },
        { q: "10. ข้อใด “ไม่ใช่” สิทธิของผู้บริโภคที่จะได้รับความคุ้มครองตามกฎหมายคุ้มครองผู้บริโภค", options: ["ก. สิทธิได้รับข่าวสารและคำพรรณนาคุณภาพที่ถูกที่ต้องและเพียงพอเกี่ยวกับสินค้าหรือบริการ", "ข. สิทธิที่จะมีอิสระในการเลือกซื้อสินค้าหรือบริการ", "ค. สิทธิได้รับความปลอดภัยจากการใช้สินค้าหรือบริการ", "ง. สิทธิได้รับการพิจารณาและชดเชยความเสียหาย", "จ. สิทธิได้รับการปฏิบัติอย่างไม่เป็นธรรมในการทำสัญญา"], ans: 4, exp: "เฉลย: จ. สิทธิได้รับการปฏิบัติอย่าง 'ไม่เป็นธรรม' ไม่ใช่สิทธิที่ถูกต้อง (ต้องเป็นสิทธิได้รับการปฏิบัติอย่างเป็นธรรม)" },
        { q: "11. สิทธิบัตรมีอายุการคุ้มครองกี่ปี", options: ["ก. 15 ปี", "ข. 50 ปี", "ค. 20 ปี", "ง. 10 ปี", "จ. 6 ปี"], ans: 2, exp: "เฉลย: ค. สิทธิบัตรการประดิษฐ์ มีอายุคุ้มครอง 20 ปี" },
        { q: "12. ผู้ให้เช่าซื้อบอกเลิกสัญญาเช่าซื้อได้เมื่อปรากฏว่าผู้เช่าซื้อผิดนัดไม่ชำระเงินกี่คราว", options: ["ก. 2 คราวไม่จำเป็นต้องติดกัน", "ข. 2 คราวติดๆกัน", "ค. 3 คราวติดๆกัน", "ง. 3 คราวไม่จำเป็นต้องติดกัน", "จ. บอกเลิกเมื่อใดก็ได้"], ans: 1, exp: "เฉลย: ข. ผิดนัดชำระค่าเช่าซื้อ 2 งวดติดต่อกัน ผู้ให้เช่าซื้อมีสิทธิบอกเลิกสัญญาได้" },
        { q: "13. ข้อใดไม่เป็นเหตุที่ทำให้ภริยาฟ้องร้องหย่าสามีได้", options: ["ก. นายสุทธิราชสามีของนางสมหญิง กลายเป็นคนวิกลจริตรักษามา 1 ปีแล้วก็ไม่หาย", "ข. นางจิตตราตกลงแยกกันอยู่กับนายจิตติสามีเป็นระยะเวลา 5 ปีแล้ว", "ค. นายมะเขือสามีของนางมะขาม มีสภาพแห่งกายที่ไม่อาจจะร่วมประเวณีกับภริยาได้ตลอดกาล", "ง. นางจรรยาภริยาของนายฉลอง มีชู้", "จ. นายมะพร้าวสามีของนางส้มโอ มีเมียน้อย"], ans: 0, exp: "เฉลย: ก. วิกลจริตต้องเป็นมาเกิน 3 ปีและยากจะรักษาหาย จึงจะเป็นเหตุฟ้องหย่าได้ (1 ปียังไม่พอ)" },
        { q: "14. “มะขามหวานเพชรบูรณ” จัดเป็นทรัพย์สินทางปัญญาประเภทใด", options: ["ก. สิ่งบ่งชี้ทางภูมิศาสตร์", "ข. เครื่องหมายการค้า", "ค. สิทธิบัตร", "ง. ความลับทางการค้า", "จ. การคุ้มครองพันธุ์พืช"], ans: 0, exp: "เฉลย: ก. เป็นชื่อที่เชื่อมโยงคุณภาพสินค้ากับแหล่งภูมิศาสตร์ที่ผลิต (GI)" },
        { q: "15. ผู้ตายมีภริยาและมีทายาทลำดับที่ 2 ด้วย ภริยาของผู้ตายจะได้ส่วนแบ่งในการแบ่งมรดกเท่าใด", options: ["ก. ได้ 2 ใน 3", "ข. ได้คนละส่วนเท่า ๆ กัน", "ค. ได้ 1 ใน 3", "ง. ได้ 2 ใน 5", "จ. ได้ 1 ใน 2"], ans: 4, exp: "เฉลย: จ. คู่สมรสรับร่วมกับบิดามารดา (ทายาทลำดับ 2) คู่สมรสจะได้กึ่งหนึ่ง (1 ใน 2) ของกองมรดก" },
        { q: "16. สัญญาเช่าที่ไม่มีกำหนดระยะเวลา หากต้องการบอกเลิกสัญญาต้องบอกกล่าวล่วงหน้าอย่างน้อยเท่าใด", options: ["ก. ไม่จำเป็นต้องบอกกล่าว", "ข. อย่างน้อย 1 เดือน", "ค. อย่างน้อยหนึ่งชั่วกำหนดระยะเวลาในการชำระค่าเช่า", "ง. อย่างน้อย 15 วัน", "จ. อย่างน้อย 30 วัน"], ans: 2, exp: "เฉลย: ค. ต้องบอกกล่าวล่วงหน้าอย่างน้อยหนึ่งชั่วระยะเวลาชำระค่าเช่า" },
        { q: "17. ทรัพย์สินระหว่างสามีภริยามีกี่ประเภท", options: ["ก. 3 ประเภท", "ข. 2 ประเภท (หนี้สิน/ทรัพย์สิน)", "ค. 2 ประเภท (ทรัพยสิทธิ/บุคคลสิทธิ)", "ง. 2 ประเภท (สินส่วนตัว/สินบริคณห์สนธิ)", "จ. 2 ประเภท คือ สินส่วนตัวกับสินสมรส"], ans: 4, exp: "เฉลย: จ. ทรัพย์สินระหว่างสามีภริยาแบ่งเป็น สินส่วนตัว และ สินสมรส" },
        { q: "18. ข้อใดต่อไปนี้ไม่เป็นกองมรดก", options: ["ก. สิทธิได้รับใบอนุญาตขับขี่รถยนต์ของผู้ตาย", "ข. หนี้เงินกู้ยืมของผู้ตาย", "ค. รถยนต์นั่งส่วนบุคคล 2 คัน ของผู้ตาย", "ง. หน้าที่ของผู้ตายในการส่งมอบห้องเช่าให้กับผู้เช่า", "จ. เงินสด 2,000,000 บาทของผู้ตาย"], ans: 0, exp: "เฉลย: ก. ใบอนุญาตขับขี่เป็นสิทธิเฉพาะตัว ไม่ตกทอดเป็นมรดก" },
        { q: "19. สัญญาค้ำประกันต้องดำเนินการอย่างใดจึงจะสามารถฟ้องร้องบังคับคดีกันได้", options: ["ก. ทำสัญญากันปากเปล่า", "ข. ต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้กู้และผู้ให้กู้", "ค. ต้องทำเป็นหนังสือลงลายมือชื่อคู่สัญญา", "ง. ต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้ค้ำประกัน", "จ. ต้องทำเป็นหนังสือและจดทะเบียน"], ans: 3, exp: "เฉลย: ง. สัญญาค้ำประกันต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อ 'ผู้ค้ำประกัน' เป็นสำคัญ" },
        { q: "20. ข้อใดคือแบบของสัญญาจำนอง", options: ["ก. มีหลักฐานเป็นหนังสือลงลายมือชื่อผู้จำนอง", "ข. ทำเป็นหนังสือ", "ค. ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่", "ง. จดทะเบียนต่อพนักงานเจ้าหน้าที่", "จ. ทำเป็นหนังสือต่อพนักงานเจ้าหน้าที่"], ans: 2, exp: "เฉลย: ค. จำนองอสังหาริมทรัพย์ต้องทำเป็นหนังสือและนำไปจดทะเบียนต่อพนักงานเจ้าหน้าที่" },

        { q: "22. แบบของสัญญาเช่าซื้อคืออะไร", options: ["ก. จดทะเบียนต่อพนักงานเจ้าหน้าที่", "ข. ทำเป็นหนังสือต่อพนักงานเจ้าหน้าที่", "ค. ทำเป็นหนังสือและจดทะเบียน", "ง. ทำหลักฐานเป็นหนังสือ", "จ. ทำเป็นหนังสือลงลายมือชื่อคู่สัญญา"], ans: 4, exp: "เฉลย: จ. สัญญาเช่าซื้อต้องทำเป็นหนังสือ ลงลายมือชื่อทั้งสองฝ่าย" },
        { q: "23. เมื่อเจ้าของมรดกเสียชีวิต บุคคลใดดังต่อไปนี้เป็นผู้ได้รับมรดก", options: ["ก. ลุง ป้า", "ข. ปูย่า", "ค. พี่น้องร่วมบิดาและมารดา", "ง. บิดา มารดา", "จ. พี่น้องร่วมแต่บิดาเดียวกัน"], ans: 3, exp: "เฉลย: ง. บิดามารดา (ทายาทลำดับ 2) มีสิทธิได้รับมรดกก่อนญาติพี่น้องอื่นๆ" },
        { q: "24. นายเอกอยู่กินกับนางทิพย์โดยมิได้จดทะเบียนสมรสหลังจากนั้นได้คลอดเด็กชายหลิว ถามว่าเด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของใคร", options: ["ก. เด็กชายหลิวเป็นบุตรที่ชอบด้วยกฎหมายของนางทิพย์เท่านั้น", "ข. ไม่เป็นบุตรใคร", "ค. ของนายเอกคนเดียว", "ง. ของทั้งคู่", "จ. ของนางทิพย์ต่อเมื่อมีคำสั่งศาล"], ans: 0, exp: "เฉลย: ก. บุตรที่เกิดจากหญิงที่ไม่ได้จดทะเบียนสมรส ถือเป็นบุตรชอบด้วยกฎหมายของมารดา (นางทิพย์) ฝ่ายเดียวเท่านั้น" },
        { q: "25. ข้อความใดต่อไปนี้เป็นการฝ่าฝืนต่อกฎหมายคุ้มครองผู้บริโภค", options: ["ก. หน้าขาวกระจ่างใสอย่างเป็นธรรมชาติ", "ข. อร่อยดีทั่วไทย เก็บไว้คู่ครัว", "ค. ช่องเจ็ดสีทีวีเพื่อคุณ", "ง. ช่วยลดอาการเสียวฟันได้", "จ. ขาหมูนางรอง อร่อยที่สุดในโลก"], ans: 4, exp: "เฉลย: จ. การโฆษณาว่า 'อร่อยที่สุดในโลก' เป็นการใช้ข้อความที่เกินจริง (Overclaim)" },
        { q: "26. ผู้ใด “ไม่มี” อำนาจฟ้องคดีผู้บริโภค", options: ["ก. คณะกรรมการคุ้มครองผู้บริโภค", "ข. สมาคมที่คณะกรรมการการคุ้มครองผู้บริโภครับรอง", "ค. เจ้าพนักงานตำรวจ", "ง. ผู้บริโภค", "จ. ผู้มีอำนาจฟ้องแทนผู้บริโภค"], ans: 2, exp: "เฉลย: ค. เจ้าพนักงานตำรวจไม่มีอำนาจฟ้องคดีผู้บริโภคแทนประชาชนในทางแพ่ง" },

        { q: "29. ถ้าผู้เช่าตามสัญญาเช่าทรัพย์ตายสัญญาเช่าจะเป็นอย่างไร", options: ["ก. สัญญาเช่าไม่ระงับ", "ข. เป็นสิทธิทางทรัพย์สินตกทอดแก่ทายาท", "ค. สัญญาเช่ายังคงมีผลผูกพันต่อไป", "ง. สัญญาเช่าเป็นอันระงับสิ้นไปไม่ตกทอดแก่ทายาทผู้เช่า", "จ. สัญญาเช่าไม่ระงับผูกพันผู้ให้เช่าต่อไป"], ans: 3, exp: "เฉลย: ง. สัญญาเช่าถือเอาคุณสมบัติผู้เช่าเป็นสาระสำคัญ เมื่อผู้เช่าตาย สัญญาเช่าจึงระงับ" },

        { q: "31. ข้อใดต่อไปนี้ “ไม่ใช่” สิทธิบัตร", options: ["ก. สิทธิบัตรการประดิษฐ์ในผลิตภัณฑ์", "ข. สิทธิบัตรการประดิษฐ์ในกรรมวิธี", "ค. อนุสิทธิบัตร", "ง. สิทธิบัตรการสร้างสรรค์", "จ. สิทธิบัตรการออกแบบผลิตภัณฑ์"], ans: 3, exp: "เฉลย: ง. 'สิทธิบัตรการสร้างสรรค์' ไม่มีในประเภทของสิทธิบัตร (การสร้างสรรค์มักใช้กับลิขสิทธิ์)" },
        { q: "32. ข้อใดต่อไปนี้ “ไม่ใช่” งานอันมีลิขสิทธิ์", options: ["ก. โปรแกรมคอมพิวเตอร์", "ข. ภาพยนตร์", "ค. ท่าเต้นประกอบเพลง", "ง. นวนิยาย", "จ. เครื่องฉายแสงโปรตรอน"], ans: 4, exp: "เฉลย: จ. เครื่องฉายแสงโปรตรอน เป็นสิ่งประดิษฐ์ ต้องนำไปจดสิทธิบัตร ไม่ใช่งานลิขสิทธิ์" },
        { q: "33. ผู้ใด “ไม่ใช่” ผู้บริโภคตามพระราชบัญญัติคุ้มครองผู้บริโภค พ.ศ. 2552", options: ["ก. นายฟ้าซื้อสินค้าจากห้างสรรพสินค้า", "ข. นางแก้วเข้ารับบริการนวดเท้าที่ร้านสปา", "ค. นายชัยซื้อรองเท้ามือสองต่อจากเพื่อน", "ง. นายเอกซื้อรถยนต์กับบริษัทก่อไกร จำกัด", "จ. นางเรไรทำบัตรเครดิตกับบริษัทเงินด่วน"], ans: 4, exp: "เฉลย: จ. ตามแนวคำตอบนี้" },

        { q: "35. อายุการคุ้มครองลิขสิทธิ์ตามข้อใด “ไม่ถูกต้อง”", options: ["ก. หากโฆษณาครั้งแรกภายหลังผู้สร้างสรรค์ตาย คุ้มครอง 50 ปีนับแต่โฆษณา", "ข. 50 ปีนับแต่ผู้สร้างสรรค์ตาย", "ค. งานศิลป์ประยุกต์คุ้มครอง 50 ปีนับแต่สร้างสรรค์หรือโฆษณาครั้งแรก", "ง. งานภาพยนตร์คุ้มครอง 50 ปี", "จ. งานภาพถ่ายคุ้มครอง 50 ปี"], ans: 2, exp: "เฉลย: ค. งานศิลปประยุกต์มีอายุคุ้มครองเพียง 25 ปี ไม่ใช่ 50 ปี" },

        { q: "37. นายเอกเป็นบิดาบุญธรรมของนายหนึ่ง และเป็นบุตรโดยชอบด้วยกฎหมายของ นายเอกับนางบี หลังจากนั้นนายเอกตาย ถามว่าใครมีสิทธิ์รับมรดกของนายเอก", options: ["ก. นายหนึ่ง", "ข. นายเอกับนางบี", "ค. วัด", "ง. นายเอกับนางบีและนายหนึ่ง", "จ. แผ่นดิน"], ans: 3, exp: "เฉลย: ง. ทั้งบิดามารดาเดิม (เอ, บี) และบุตรบุญธรรม (หนึ่ง) ต่างก็เป็นทายาทโดยธรรมที่มีสิทธิรับมรดก" },
        { q: "38. กฎหมายวิธีพิจารณาคดีกรณีเกิดข้อพิพาททางแพ่งระหว่างผู้บริโภคกับผู้ประกอบธุรกิจปัจจุบันคือกฎหมายใด", options: ["ก. พ.ร.บ. ว่าด้วยข้อสัญญาที่ไม่เป็นธรรม", "ข. ป.วิ.อาญา", "ค. พระราชบัญญัติคุ้มครองผู้บริโภค", "ง. พระราชบัญญัติวิธีพิจารณาคดีผู้บริโภค พ.ศ. 2551", "จ. ป.วิ.แพ่ง"], ans: 2, exp: "เฉลย: ค. (อ้างอิงตามคีย์เฉลยที่ระบุข้อ 38=ค)" },
        { q: "39. กฎหมายว่าด้วยเรื่องครอบครัว “ไม่ใช่” กับผู้นับถือศาสนาอิสลามในจังหวัดใด", options: ["ก. จังหวัดปัตตานี", "ข. จังหวัดพังงา", "ค. จังหวัดกรุงเทพ ฯ", "ง. จังหวัดระยอง", "จ. จังหวัดชุมพร"], ans: 0, exp: "เฉลย: ก. กฎหมายครอบครัวและมรดกอิสลามใช้บังคับเฉพาะใน 4 จังหวัดชายแดนภาคใต้ (ปัตตานี นราธิวาส ยะลา สตูล)" },
        { q: "40. ข้อใดต่อไปนี้คือจำนอง", options: ["ก. การใช้ตำแหน่งประกันการชำระหนี้", "ข. การนำสังหาริมทรัพย์ไปตราไว้เป็นประกัน", "ค. การใช้บุคคลประกัน", "ง. การส่งมอบสังหาริมทรัพย์ไว้เป็นประกัน", "จ. การนำทรัพย์สินไปตราไว้เป็นประกันการชำระหนี้"], ans: 4, exp: "เฉลย: จ. จำนองคือการนำอสังหาริมทรัพย์ ไป 'ตราไว้' (จดทะเบียน) เป็นประกันหนี้ โดยไม่ต้องส่งมอบทรัพย์สิน" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const progressText = document.getElementById("progress-text");
    const questionText = document.getElementById("question-text");
    const optionsList = document.getElementById("options-list");
    const rationaleText = document.getElementById("rationale-text");
    const nextBtn = document.getElementById("next-btn");
    const quizArea = document.getElementById("quiz-area");
    const resultContainer = document.getElementById("result-container");
    const finalScoreText = document.getElementById("final-score");

    function loadQuestion() {
        // รีเซ็ต UI
        rationaleText.style.display = "none";
        nextBtn.style.display = "none";
        optionsList.innerHTML = "";
        
        const qData = quizData[currentQuestionIndex];
        
        // อัปเดตข้อความต่างๆ
        progressText.innerText = `ข้อ ${currentQuestionIndex + 1} / ${quizData.length}`;
        questionText.innerText = qData.q;
        rationaleText.innerText = qData.exp;

        // ถ้าเป็นข้อสุดท้าย เปลี่ยนคำปุ่มเป็นดูผลคะแนน
        if (currentQuestionIndex === quizData.length - 1) {
            nextBtn.innerText = "ดูผลคะแนนรวม";
        } else {
            nextBtn.innerText = "ข้อถัดไป";
        }

        // สร้างปุ่มช้อยส์
        qData.options.forEach((optText, index) => {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optText;

            btn.onclick = () => selectOption(btn, index, qData.ans);
            
            li.appendChild(btn);
            optionsList.appendChild(li);
        });
    }

    function selectOption(selectedBtn, selectedIndex, correctIndex) {
        const allButtons = optionsList.querySelectorAll(".option-btn");
        
        // ล็อคปุ่มทั้งหมด
        allButtons.forEach(btn => btn.disabled = true);

        // ตรวจคำตอบและให้สี
        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add("correct");
            score++; // บวกคะแนนถ้าถูก
        } else {
            selectedBtn.classList.add("incorrect");
            allButtons[correctIndex].classList.add("correct"); // โชว์ข้อที่ถูกให้ดู
        }

        // แสดงคำอธิบายและปุ่มถัดไป
        rationaleText.style.display = "block";
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizArea.style.display = "none";
        resultContainer.style.display = "block";
        finalScoreText.innerText = `คุณทำได้ ${score} / ${quizData.length} คะแนน`;
    }

    // เริ่มต้นทำงานข้อแรกเมื่อเปิดหน้า
    loadQuestion();

</script>
